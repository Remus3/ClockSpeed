# =============================================================================
# Clockspeed - CI tier 2: the full lane.
#
# CONVENTIONS.md section 8: tier 2 is the nightly-and-on-tag lane. It carries
# the full suite with parallelism, the Windows runner, the CLEAN-CHECKOUT PROBE,
# the dependency audit and the license audit. It is not on the every-push path
# because CI minutes are metered on a private repo - that is the whole point of
# tiering.
#
# CLEAN-MACHINE INVARIANT. BOOTSTRAP.md section 8.1: fixtures are small synthetic
# registries hand-authored in the repo, never slices of real game data, so the
# suite runs on a machine with no game installed and no save file present.
# Nothing here may expect the game install, the save directory, or any
# publisher-owned asset to exist. Equally, nothing here appends `|| true` or
# `continue-on-error` to a step that is meant to catch a crash - a tool that
# blows up on a clean machine is a real defect and this lane must show it. The
# only advisory steps are the two audits at the bottom, and they say so.
#
# There is deliberately NO tier3.yml - see the comment block at the end of file.
# =============================================================================

name: tier2

on:
  # Nightly. Off the hour on purpose: the top of the hour is the busiest slot on
  # shared runners and scheduled runs are queued, not guaranteed on time.
  schedule:
    - cron: '17 3 * * *'
  # Every tag push. Tier 1 handles branches; tags land here.
  push:
    tags:
      - 'v*'
  # Manual. Required so the lane can be exercised on demand rather than only by
  # waiting for the clock - notably right after this file changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier2-${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress. A nightly or tag run that is half finished still
  # carries useful signal; cancelling it to start another wastes the minutes
  # already spent.
  cancel-in-progress: false

env:
  # CONVENTIONS.md section 10.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ===========================================================================
  # Job 1 - the full suite on both target platforms.
  # ===========================================================================
  suite:
    name: full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A Windows-only failure and a Linux-only failure are different bugs, and
      # this project's primary target is Windows. Never let one abort the other.
      fail-fast: false
      matrix:
        # windows-latest is here because the character-set, path and
        # line-ending traps in CONVENTIONS.md section 10 are Windows-specific:
        # PowerShell 5.1 ANSI-decoding a BOM-less .ps1, LF-to-CRLF conversion in
        # write_text, and backslash paths in JSON config. ubuntu-latest is the
        # cheap canary and the portability check.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # One script for both platforms. Git Bash ships on the Windows runner.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install toolchain
        # The `dev` extra in pyproject.toml is the single owner of tool versions
        # (CONVENTIONS.md section 2). Editable so the suite imports the package
        # the same way it does on a developer machine.
        run: python -m pip install -e ".[dev]"

      - name: Enable test parallelism if pytest-xdist is available
        id: xdist
        run: |
          if python -m pip install pytest-xdist && python -c "import xdist" 2>/dev/null; then
            echo "args=-n auto" >> "$GITHUB_OUTPUT"
            echo "pytest-xdist available - the suite runs in parallel"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "pytest-xdist unavailable - the suite runs serially"
          fi

      # EXPLICIT TARGET DIRECTORY, never a bare recursive run from the repo root.
      # CONVENTIONS.md section 7.1: a bare root invocation can sweep runtime
      # state directories and destroy live locks or data. The invocation is kept
      # identical to the local one so CI and the developer machine never diverge.
      - name: Full test suite
        run: python -m pytest tests -q ${{ steps.xdist.outputs.args }}

  # ===========================================================================
  # Job 2 - THE CLEAN-CHECKOUT PROBE. The highest-value job in this file.
  #
  # CONVENTIONS.md section 1: a fresh clone has NO local wiring. Git hooks, MCP
  # config and local settings are all untracked or local-config, so a new clone
  # runs ZERO protection until someone wires it. CONVENTIONS.md section 8 says
  # this probe is the only thing that catches "works on my machine" wiring.
  #
  # The shape matters: check out into ./source, then CLONE FRESH into ./probe and
  # do all the work there. Running the bootstrap in the checkout itself would
  # prove nothing, because the checkout is not the thing a new contributor gets.
  # ===========================================================================
  clean-checkout-probe:
    name: clean-checkout probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both platforms. Hook wiring is where the platform-specific traps live:
        # core.hooksPath is keyed by path STRING, so C:\X, C:/X and C:/x are three
        # separate entries (CONVENTIONS.md section 16 item 3). CRLF in a hook is
        # the other classic trap - measured 2026-08-13 as tolerated by Git for
        # Windows' bundled bash, but dash and ash on this POSIX runner are stricter,
        # which is exactly why the probe runs on both platforms.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (the source the fresh clone is taken from)
        uses: actions/checkout@v4
        with:
          path: source
          # Full history so the local clone below is an ordinary clone rather
          # than a clone of a shallow repository.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Clone fresh into a separate directory
        run: |
          git clone --no-hardlinks ./source ./probe
          echo "fresh clone created at ./probe"

      # --- Assertion 1: the fresh clone runs zero protection. ---
      # This half of the pair is what makes the other half meaningful. Without
      # it, a runner that somehow inherited core.hooksPath would let the
      # post-bootstrap assertion pass while proving nothing about install_hooks.
      - name: Assert core.hooksPath is NOT set before the bootstrap
        working-directory: probe
        run: |
          if git config --get core.hooksPath > /dev/null 2>&1; then
            echo "FAIL: core.hooksPath is already set in a freshly cloned repo."
            echo "Either the clone inherited config it should not have, or the"
            echo "value is tracked somewhere it must not be. Either way this"
            echo "probe can no longer prove install_hooks.py does anything."
            exit 1
          fi
          echo "OK: core.hooksPath is unset in the fresh clone, as expected."
          echo "CONVENTIONS.md section 1 - a new clone runs zero protection."

      - name: Install the toolchain INTO the fresh clone
        working-directory: probe
        # Order matters and is deliberate: toolchain first, bootstrap second.
        # That is what a human does on a new machine, and scripts/verify_env.py
        # exists to ASSERT the toolchain is present, not to install it. Doing it
        # in this order means a verify_env failure below is a real finding rather
        # than one this workflow inflicted on itself.
        #
        # Installed from the clone's own pyproject.toml, not from ./source, so
        # nothing about this probe depends on the prepared checkout next door.
        run: python -m pip install -e ".[dev]"

      # --- Bootstrap step 1 of 3 (CONVENTIONS.md section 1, exact order). ---
      - name: Bootstrap 1/3 - install_hooks.py
        working-directory: probe
        run: python scripts/install_hooks.py

      # --- Assertion 2: the bootstrap actually wired the hooks. ---
      - name: Assert core.hooksPath IS set after install_hooks.py
        working-directory: probe
        run: |
          set +e
          HOOKS_PATH="$(git config --get core.hooksPath)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$HOOKS_PATH" ]; then
            echo "FAIL: core.hooksPath is NOT set after install_hooks.py ran."
            echo "CONVENTIONS.md section 1 requires install_hooks.py to fail"
            echo "loudly when it cannot set core.hooksPath. It exited zero and"
            echo "left the repo unprotected, which is the worse outcome."
            exit 1
          fi
          echo "core.hooksPath = $HOOKS_PATH"
          if [ ! -d "$HOOKS_PATH" ]; then
            echo "FAIL: core.hooksPath points at a directory that does not exist."
            exit 1
          fi
          echo "OK: core.hooksPath is set and the directory it names exists."
          # PRESENCE IS NOT FIRING. CONVENTIONS.md section 16 item 4: the only
          # valid proof a hook fires is end to end - stage a violation, attempt a
          # REAL commit, assert HEAD is unchanged. THIS step still proves only
          # WIRING; the end-to-end proof is the last step of this job, added by
          # CS-924. Do not read this assertion as evidence any hook runs.
          echo "NOTE: this asserts hook WIRING, not hook FIRING."
          echo "The firing proof is the last step of this job - see CS-924."

      # --- Bootstrap step 2 of 3. ---
      # EXPECTED ON A CI RUNNER: verify_env.py reports the game install as
      # MISSING, because no runner has the game. That must NOT fail this job.
      # The contract (CONVENTIONS.md section 1) is that verify_env.py exits
      # non-zero only on a missing HARD dependency, and the game install is not
      # one for the test suite - BOOTSTRAP.md section 8.1 requires the suite to
      # run green with no game installed and no save file present.
      # So this step is BLOCKING on purpose: if it goes red here, either a hard
      # dependency really is missing or verify_env.py has misclassified the game
      # install as hard. Both are real bugs. Do not paper over either one by
      # adding continue-on-error to this step.
      # `--json` is available on this tool if a machine-readable record is ever
      # wanted; the default table is what a human reads in the run log.
      - name: Bootstrap 2/3 - verify_env.py (game install MISSING is expected)
        working-directory: probe
        run: python scripts/verify_env.py

      # --- Bootstrap step 3 of 3. ---
      # A fresh clone has no semantic recall store: it is local and gitignored
      # (CONVENTIONS.md section 11.2), so on a runner there is nothing to mirror
      # into. memory_sync.py must degrade cleanly in that case. This step is
      # blocking for the same reason as the one above - if it exits non-zero on a
      # clean machine, that is a wiring defect in the tool, and swallowing it
      # here would hide exactly the failure this probe exists to find.
      - name: Bootstrap 3/3 - memory_sync.py
        working-directory: probe
        run: python tools/memory_sync.py

      # --- And finally: does the suite run in a clone nobody prepared? ---
      - name: Suite in the fresh clone
        working-directory: probe
        run: python -m pytest tests -q

      # =====================================================================
      # CS-924 - HOOK FIRING, END TO END. The step every other assertion in
      # this job has been standing in for.
      #
      # WHAT WAS ACTUALLY MISSING, stated precisely, because the roadmap item
      # overstated it and the correction matters. Hook CONTENT has been driven
      # by real commits on POSIX since 2026-08-22. THREE modules do it -
      # tests/test_hook_interpreter_ladder.py (all three hooks, real commit AND
      # real push), tests/test_commit_msg_gate.py and tests/test_precommit_gate.py
      # - each building a throwaway repo, pointing core.hooksPath at a
      # byte-identical copy of a tracked hook, running a REAL `git commit` and
      # asserting on the exit code AND on whether HEAD moved. tier1 runs them on
      # ubuntu-latest on every push. So it is NOT true that no hook had ever run
      # on POSIX, and nothing here should be cited as if it were.
      #
      # THREE THINGS WERE GENUINELY UNMEASURED, and this step is the only
      # place they can be measured:
      #   1. FIRING AT THE TRACKED INDEX MODE. All three modules do
      #      `installed.chmod(0o755)` on their copy, which MASKS whatever mode
      #      the index carries - the sandbox copies BYTES, never an index entry.
      #      MEASURED: at 4b776f2, with all three hooks tracked at 100644, tier1
      #      run 34067366062 on ubuntu was fully green on those same arms. So
      #      CS-923's flip to 100755 changed nothing they can see, and no test
      #      anywhere reads the tracked mode back THROUGH A RUNNING HOOK.
      #   2. FIRING IN A REAL CLONE WIRED BY THE REAL BOOTSTRAP. Those modules
      #      hand-set core.hooksPath and hand-copy one hook into a hand-built
      #      empty repo. Nothing exercised scripts/install_hooks.py and then
      #      committed through what it wired.
      #   3. FIRING AT ALL ON A POSIX FILESYSTEM WHERE THE EXEC BIT IS REAL.
      #      Every end-to-end measurement in docs/LEDGER.md was taken on
      #      git 2.53.0.windows.3, and Git for Windows masks X_OK - so the
      #      operator's machine cannot observe a non-executable hook silently
      #      not running. That is the exact failure CS-923 was about.
      #
      # WHY THIS STEP IS LAST. It creates real commits in ./probe, and one of
      # them carries an em dash on purpose. The suite step above enumerates
      # tracked files and would rightly go red on that content. Ordering the
      # firing arm after the suite keeps the two from contaminating each other.
      #
      # THE EM DASH IS WRITTEN AS RAW UTF-8 BYTES AT RUN TIME. Putting the
      # character itself in this file would violate CLAUDE.md non-negotiable 4
      # and the tier1 character-set gate would reject this workflow.
      #
      # AN UNCONFIGURED CLONE FAILS HERE RATHER THAN SKIPPING. A skip
      # conditioned on the thing under test is a mute button the defect gets to
      # press - CS-605 closed on exactly that shape.
      # =====================================================================
      - name: Hook FIRING end to end - stage a violation, attempt a real commit
        working-directory: probe
        run: |
          set -u
          FAIL=0
          bad() { printf 'FAIL: %s\n' "$*"; FAIL=1; }

          # --- Precondition A: the hooks are wired. ---
          HOOKS_PATH="$(git config --get core.hooksPath || true)"
          if [ -z "$HOOKS_PATH" ]; then
            echo "FAIL: core.hooksPath is unset, so no hook can fire here."
            echo "This is a FAILURE and never a skip: a clone that quietly"
            echo "passes is indistinguishable from one with a working gate."
            exit 1
          fi
          echo "core.hooksPath = $HOOKS_PATH"

          HOOK_FILE="$HOOKS_PATH/pre-commit"
          case "$HOOK_FILE" in
            /*|[A-Za-z]:*) ;;
            *) HOOK_FILE="$PWD/$HOOKS_PATH/pre-commit" ;;
          esac
          if [ ! -f "$HOOK_FILE" ]; then
            echo "FAIL: no pre-commit hook at $HOOK_FILE"
            exit 1
          fi

          # --- Precondition B: on POSIX the hook must be EXECUTABLE. ---
          # The CS-923 index mode and install_hooks.py::set_executable meeting a
          # real filesystem. Git silently refuses to run a non-executable hook
          # and reports NOTHING, so without this the gate could be absent while
          # every wiring assertion above still passed. The guard is on the
          # PLATFORM - a fact about the runner - never on the code under test.
          case "$(uname -s 2>/dev/null || echo unknown)" in
            MINGW*|MSYS*|CYGWIN*)
              echo "NOTE: Git for Windows masks X_OK - the exec bit is"
              echo "unmeasurable on this leg. The ubuntu leg measures it."
              ;;
            *)
              if [ ! -x "$HOOK_FILE" ]; then
                bad "the pre-commit hook is NOT executable on a POSIX host."
                bad "git refuses to run it and says nothing, so the tier-0 gate"
                bad "would be silently absent in every clone made this way."
              else
                echo "OK: the pre-commit hook is executable on this POSIX host."
              fi
              ;;
          esac

          # A synthetic identity. A fresh clone has none, and git refusing for a
          # missing identity is a non-zero exit for entirely the wrong reason.
          # It is synthetic rather than the runner's, so no real name is written
          # into a commit object (CLAUDE.md non-negotiable 3).
          git config user.name "clockspeed probe"
          git config user.email "probe@example.invalid"

          HEAD_BEFORE="$(git rev-parse HEAD)"
          echo "HEAD before: $HEAD_BEFORE"

          # --- CONTROL 1: a legitimate commit must LAND. ---
          # Without this, a clone that refuses EVERYTHING - a broken
          # interpreter, a missing gate, an unusable identity - would report
          # "the hook fired" while proving the exact opposite.
          printf 'clean ascii line\n' > cs924_control.md
          git add cs924_control.md
          if git commit -q -m "CS-924 probe control: a clean commit must land"; then
            echo "OK: control - a legitimate commit LANDED through the hooks."
          else
            echo "FAIL: the CONTROL commit was refused. The hooks are refusing"
            echo "everything, so the violation arm below would pass while"
            echo "measuring nothing at all."
            exit 1
          fi
          HEAD_CONTROL="$(git rev-parse HEAD)"
          if [ "$HEAD_CONTROL" = "$HEAD_BEFORE" ]; then
            bad "the control commit reported success but HEAD did not move."
          fi

          # --- THE ARM: a REAL violation through a REAL commit. ---
          printf 'a line with an em dash \xe2\x80\x94 in it\n' > cs924_violation.md
          git add cs924_violation.md

          set +e
          COMMIT_OUT="$(git commit -m "CS-924 probe: this commit MUST be refused" 2>&1)"
          COMMIT_RC=$?
          set -e

          echo "----- commit output -----"
          printf '%s\n' "$COMMIT_OUT"
          echo "----- end commit output -----"
          echo "git commit exit code: $COMMIT_RC"

          HEAD_AFTER="$(git rev-parse HEAD)"

          if [ "$COMMIT_RC" -eq 0 ]; then
            bad "git commit EXITED 0 over a staged em dash - the gate did not fire."
          fi

          # An exit code alone is not proof: a hook can refuse AFTER the commit
          # object is written. HEAD is the fact that matters.
          if [ "$HEAD_AFTER" != "$HEAD_CONTROL" ]; then
            bad "HEAD MOVED over a refused commit: $HEAD_CONTROL -> $HEAD_AFTER"
          fi

          # The refusal must be ATTRIBUTABLE to this project's gate. A missing
          # identity, an unborn branch or an empty index each produce a non-zero
          # exit that has nothing whatever to do with the hook.
          case "$COMMIT_OUT" in
            *"precommit_gate: BLOCKED"*|*"clockspeed pre-commit"*)
              echo "OK: the refusal carries this project's own gate banner."
              ;;
            *)
              bad "the commit was refused, but NOT by this project's gate."
              bad "Neither 'precommit_gate: BLOCKED' nor 'clockspeed pre-commit'"
              bad "appears in the output, so something else refused it."
              ;;
          esac

          # --- CONTROL 2: the SAME violation must LAND with --no-verify. ---
          # This is what makes the refusal attributable to the HOOK LAYER rather
          # than to the content, the identity or git itself: with hooks bypassed
          # the identical staged bytes commit cleanly.
          #
          # Run ONLY if the violation was actually refused. If the gate is
          # disarmed the violation has already landed, the index is empty, and
          # this control would report a true statement about an empty index and
          # a misleading one about the hook. The first failure is the finding.
          if [ "$HEAD_AFTER" = "$HEAD_CONTROL" ]; then
            if git commit -q --no-verify \
                -m "CS-924 probe control: the same violation lands with hooks off"; then
              echo "OK: control - the identical violation LANDED under --no-verify."
              echo "The refusal is therefore the HOOK's, not git's and not the"
              echo "content's."
            else
              bad "the same violation was refused even with --no-verify, so the"
              bad "refusal above cannot be attributed to the hook layer."
            fi
          else
            echo "NOTE: control 2 skipped - the violation already landed, so the"
            echo "index is empty. The failure above is the finding."
          fi

          if [ "$FAIL" -eq 0 ]; then
            echo ""
            echo "OK: a Clockspeed hook was measured FIRING end to end, in a real"
            echo "clone, at its tracked mode, wired by scripts/install_hooks.py."
          fi
          exit "$FAIL"

  # ===========================================================================
  # Job 3 - supply chain. Both audits are ADVISORY at this stage.
  #
  # Advisory because the project has almost no dependencies yet (BOOTSTRAP.md
  # section 11: no external optimizer in phase 3, no community datasets), so a
  # blocking audit today would gate on the CI toolchain's own transitive tree
  # rather than on anything this project chose. Wired now anyway so it reports
  # from day one and the first real dependency arrives into a working gate.
  #
  # `continue-on-error` rather than `|| true`: the step still shows as failed in
  # the run summary, so an advisory finding is visible instead of swallowed.
  #
  # FLIP TO BLOCKING when the project takes its first real runtime dependency -
  # that is also the moment CONVENTIONS.md section 14 (the license gate) starts
  # having something to say, and tier 3 item 3 depends on this being real.
  # ===========================================================================
  audits:
    name: dependency and license audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # Explicit, so the shell is `bash -eo pipefail`. Both audit steps pipe
        # into tee, and without pipefail tee's exit code would hide the auditor's
        # - which would make every advisory step report green forever.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install audit tooling
        run: python -m pip install pip-audit pip-licenses

      - name: Dependency audit (advisory)
        continue-on-error: true
        run: |
          mkdir -p ci-audit-reports
          pip-audit --progress-spinner off --desc \
            | tee ci-audit-reports/pip-audit.txt

      - name: License audit (advisory)
        continue-on-error: true
        run: |
          mkdir -p ci-audit-reports
          pip-licenses --format=markdown --with-authors --with-urls \
            | tee ci-audit-reports/pip-licenses.md

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-audit-reports
          path: ci-audit-reports/
          if-no-files-found: warn
          # Short retention: these are regenerated nightly and storage is not free.
          retention-days: 14

  # ===========================================================================
  # Job 4 - the Node lane: the Electron shell's own suite, behind a count floor.
  #
  # Jobs in this file run in parallel, so the number is a label and not an
  # order. This one is last only to keep its diff small.
  #
  # WHY A COUNT FLOOR RATHER THAN AN EXIT CODE. `node --test` EXITS 0 OVER ZERO
  # TESTS. Measured on v24.15.0 in a directory holding no test file at all:
  # exit 0, and a complete TAP trailer reading `# tests 0`. A step that reads
  # only the exit code therefore reports GREEN HAVING RUN NOTHING, and would go
  # on reporting green if the test directory were renamed, emptied, or missed
  # by a bad glob. The parse below is the whole reason this lane means anything.
  #
  # THE INVOCATION IS BARE `node --test`, RUN FROM INSIDE shell/. That form was
  # settled by measurement; do not tidy it into either of these:
  #   node --test "test/*.test.js"  silently misses nested files, still exits 0
  #   node --test test              broken on v24.15.0 - it tries to load the
  #                                 directory as a module and reports fail 1
  #
  # NO `npm ci` AND NO `npm install`, DELIBERATELY. electron 44.0.0 declares no
  # postinstall script, so an install does NOT fetch its binary; the first
  # `require("electron")` triggers a large lazy download at RUN time instead.
  # Every shell/lib/* module imports Node stdlib only, so the suite runs with no
  # node_modules at all - asserted below rather than left to a comment. Keeping
  # the install out is a property of this job, not an omission from it.
  # ===========================================================================
  shell-suite:
    name: shell suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Same reasoning as job 1: a Windows-only failure and a Linux-only
      # failure are different bugs, and Windows is this project's primary
      # target. Never let one abort the other.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        # One script for both platforms, as everywhere else in this file.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # This workflow owns the CI Node version, exactly as it already owns the
      # CI Python version in the jobs above. `shell/package.json` engines is a
      # FLOOR (">=22.12.0"): a different fact, and it keeps its own owner. This
      # pin tracks the developer machine's major, which is where every measured
      # claim in this job's comments was measured (v24.15.0).
      #
      # No `cache:` key on purpose - caching a dependency install that this job
      # deliberately does not perform would only imply one exists.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Pairs with the "no npm ci" note above by ASSERTING the property instead
      # of trusting the comment to be read. If a real runtime dependency ever
      # lands, this step is what will stop you: read that note, then retire this
      # assertion deliberately rather than deleting it in passing.
      - name: Assert the suite needs no installed dependencies
        run: |
          if [ -e shell/node_modules ]; then
            echo "FAIL: shell/node_modules exists in a job that installs nothing."
            echo "Either a step started installing dependencies, or the runner"
            echo "cached a tree this job never asked for. Both make the 'runs on"
            echo "Node stdlib alone' property untrue while still looking green."
            exit 1
          fi
          echo "OK: no shell/node_modules - the suite runs on Node stdlib alone."

      # NOTHING IN THIS REPOSITORY LINTS JAVASCRIPT. ruff is Python-only, so
      # without this step shell/main.js and shell/preload.js are graded by
      # nothing whatsoever: they import electron, so no test can import them,
      # so the suite below never reaches them.
      #
      # WHAT THIS CATCHES: syntax errors. Measured on v24.15.0 - `node --check`
      # exits 1 and prints the offending line on a parse error, and exits 0 on a
      # file containing `require("electron")` WITHOUT executing that import, so
      # it works with no node_modules present.
      #
      # WHAT IT DOES NOT CATCH, AND IT IS NOT CLOSE: anything that happens only
      # at run time. A file that calls a number as a function passed this check
      # cleanly when measured. This is a parse gate, not a linter, and it must
      # not be cited as one.
      - name: Syntax-check every tracked JavaScript file under shell/
        run: |
          CHECKED=0
          BAD=0
          while IFS= read -r tracked; do
            case "$tracked" in
              *.js) ;;
              *) continue ;;
            esac
            CHECKED=$((CHECKED + 1))
            if node --check "$tracked"; then
              echo "  ok   $tracked"
            else
              echo "  FAIL $tracked"
              BAD=1
            fi
          done < <(git ls-files -- shell)

          # The same zero-count trap the suite floor below exists for: a check
          # that ran over nothing exits 0 and tells you nothing.
          if [ "$CHECKED" -eq 0 ]; then
            echo "FAIL: no tracked .js under shell/, so this step graded nothing."
            echo "git ls-files found no JavaScript to check. Either the tree"
            echo "moved or the pathspec is wrong; it is not a clean bill."
            exit 1
          fi
          echo "syntax-checked $CHECKED tracked JavaScript file(s) under shell/"
          exit "$BAD"

      - name: Shell suite with a real count floor
        working-directory: shell
        run: |
          # The exit code is captured rather than relied upon - see the count
          # floor below for why. It is still enforced: a non-zero exit is a
          # failure even when the trailer looks clean.
          set +e
          node --test --test-reporter=tap > tap.txt 2>&1
          NODE_RC=$?
          set -e

          echo "----- TAP -----"
          cat tap.txt
          echo "----- end TAP -----"
          echo "node --test exit code: $NODE_RC"

          # Read one field of the TAP trailer. Anchored at column 0, exactly
          # three whitespace-separated fields, numeric value - and LAST MATCH
          # WINS.
          #
          # LAST-MATCH IS LOAD-BEARING, NOT GARNISH. Measured on v24.15.0: the
          # runner re-emits a test's own stdout as TAP comments by prefixing
          # "# ". A leading '#' in the payload is escaped to "\#", but a payload
          # with NO leading hash is not escaped at all - so console.log with the
          # text `tests 0` emits a byte-identical "# tests 0" at column 0. A
          # first-match parser reads that forgery instead of the trailer. Forged
          # lines are emitted while the test runs; the real trailer is emitted
          # last, which is exactly why last-match defeats them.
          #
          # A test NAME cannot forge a trailer: per-test lines are
          # "# Subtest: <name>", so field 2 is "Subtest:" and never "tests".
          #
          # The CR strip is insurance. Measured zero CR bytes in this stream on
          # Windows, but a trailing CR would make every field parse as absent
          # and turn the whole floor into a confusing red on one platform only.
          trailer_field() {
            awk -v key="$1" '
              { sub(/\r$/, "") }
              /^# / && NF == 3 && $2 == key && $3 ~ /^[0-9]+$/ { value = $3 }
              END { print value }
            ' tap.txt
          }

          TESTS="$(trailer_field tests)"
          PASSED="$(trailer_field pass)"
          FAILURES="$(trailer_field fail)"
          CANCELLED="$(trailer_field cancelled)"
          SKIPPED="$(trailer_field skipped)"
          TODO="$(trailer_field todo)"

          echo "parsed trailer: tests=$TESTS pass=$PASSED fail=$FAILURES" \
               "cancelled=$CANCELLED skipped=$SKIPPED todo=$TODO"

          # A MISSING TRAILER IS NOT ZERO. Absent means the run never reached
          # its summary, or the reporter changed shape. Reading absent as zero
          # would convert a crashed run into a quiet pass on every clause below.
          for probe in "tests:$TESTS" "fail:$FAILURES" "cancelled:$CANCELLED" \
                       "skipped:$SKIPPED" "todo:$TODO"; do
            if [ -z "${probe#*:}" ]; then
              echo "FAIL: the TAP trailer carries no '# ${probe%%:*} N' line."
              echo "Absent is not zero. These counts cannot be trusted and this"
              echo "lane must not report green on them."
              exit 1
            fi
          done

          # Every clause is evaluated before exiting, so one run reports every
          # violation rather than only the first.
          FLOOR=0

          if [ "$NODE_RC" -ne 0 ]; then
            echo "FAIL: node --test exited $NODE_RC."
            FLOOR=1
          fi

          if [ "$TESTS" -le 0 ]; then
            echo "FAIL: the suite reported $TESTS tests, so it graded nothing."
            echo "node --test exits 0 over zero tests - this clause is the only"
            echo "thing standing between that and a green lane."
            FLOOR=1
          fi

          if [ "$FAILURES" -ne 0 ]; then
            echo "FAIL: $FAILURES failing test(s)."
            FLOOR=1
          fi

          if [ "$CANCELLED" -ne 0 ]; then
            echo "FAIL: $CANCELLED cancelled test(s)."
            echo "A cancelled test did not report a result, so it is unmeasured"
            echo "rather than passing."
            FLOOR=1
          fi

          # SKIPPED AND TODO ARE FAILURES HERE, AND THAT IS NOT DECORATION.
          # CS-605 closed on exactly this: a skip conditioned on the code under
          # test becomes a mute button the defect gets to press, and the suite
          # stays green while measuring less and less. CS-613 is open on the
          # same class. Measured on v24.15.0: a suite whose only non-passing
          # tests are one skip and one todo exits 0, so nothing but this clause
          # would notice.
          if [ "$SKIPPED" -ne 0 ]; then
            echo "FAIL: $SKIPPED skipped test(s). A skip is an unmeasured test."
            echo "If a skip is genuinely warranted, it needs a roadmap item and"
            echo "an explicit decision - not a silent pass in the nightly lane."
            FLOOR=1
          fi

          if [ "$TODO" -ne 0 ]; then
            echo "FAIL: $TODO todo test(s). A todo is an unmeasured test."
            FLOOR=1
          fi

          if [ "$FLOOR" -eq 0 ]; then
            echo "OK: $TESTS tests, all passing, none skipped, todo or cancelled."
          fi
          exit "$FLOOR"

# =============================================================================
# TIER 3 - THE VISIBILITY-FLIP GATE. NOT BUILT YET, AND NOT AN OVERSIGHT.
#
# There is no .github/workflows/tier3.yml on purpose. Tier 3 is the manual
# pre-flip gate (CONVENTIONS.md section 17, BOOTSTRAP.md section 10 phase 7) and
# it is not due until phase 7. Creating it early invites it to be run, passed
# synthetically, and treated as satisfied - which is precisely the failure mode
# CONVENTIONS.md section 4 names: "gated items are never closed synthetically".
# The repo is private first, public later; the flip is the irreversible step and
# it gets a real gate at the time, not a placeholder now.
#
# The seven checks that must all pass at the flip (CONVENTIONS.md section 17):
#
#   1. Full-history secret scan. The WHOLE history, not just the working tree -
#      history is what leaks. A clean tree over a dirty history is the trap.
#   2. PII scan across all tracked files AND all commit messages. Patterns
#      include: the numeric platform account id, the Windows account name, any
#      absolute path under a user home, and the machine name. BOOTSTRAP.md
#      section 2.2 adds two more that are measured, not hypothetical: the save
#      header carries the platform account identifier and the player's DISPLAY
#      NAME as plaintext inside its options string, so both decoded values are
#      tier-3 scan patterns too.
#   3. Third-party license audit against CONVENTIONS.md section 14. Read the
#      copyright LINE, not just the SPDX name; a repo can contradict itself
#      between its LICENSE file and its manifest.
#   4. No publisher-owned data assets tracked, in history or in the tree - no
#      docs JSON, no usmap, no extracted asset, and no .sav. A save file is a
#      personal-data-bearing artifact (BOOTSTRAP.md section 2.2), so this check
#      overlaps check 2 and both must run.
#   5. README.md gets an outsider from zero to a first result.
#   6. All doc cross-references resolve; no orphaned or stale markdown. Tier 1
#      already runs the relative-link half of this every push; tier 3 adds the
#      orphan and staleness sweep and should also validate external URLs, which
#      tier 1 deliberately does not (a network check would make the fast lane
#      flaky).
#   7. A clean-checkout probe passes on a machine that has never seen the
#      project. The `clean-checkout-probe` job above is the CI approximation and
#      is NOT a substitute: a runner is not a machine that has never seen the
#      project in the sense that matters, because the workflow itself supplies
#      the interpreter and the toolchain.
#
# If history turns out to be dirty, CONVENTIONS.md section 17 says the honest fix
# is a fresh-history public repo, not an incomplete rewrite - and that this is
# decided before the first commit, because it is far cheaper then.
# =============================================================================
