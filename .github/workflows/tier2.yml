# =============================================================================
# Clockspeed - CI tier 2: the full lane.
#
# CONVENTIONS.md section 8: tier 2 is the nightly-and-on-tag lane. It carries
# the full suite with parallelism, the Windows runner, the CLEAN-CHECKOUT PROBE,
# the dependency audit and the license audit. It is not on the every-push path
# because CI minutes are metered on a private repo - that is the whole point of
# tiering.
#
# CLEAN-MACHINE INVARIANT. BOOTSTRAP.md section 8.1: fixtures are small synthetic
# registries hand-authored in the repo, never slices of real game data, so the
# suite runs on a machine with no game installed and no save file present.
# Nothing here may expect the game install, the save directory, or any
# publisher-owned asset to exist. Equally, nothing here appends `|| true` or
# `continue-on-error` to a step that is meant to catch a crash - a tool that
# blows up on a clean machine is a real defect and this lane must show it. The
# only advisory steps are the two audits at the bottom, and they say so.
#
# There is deliberately NO tier3.yml - see the comment block at the end of file.
# =============================================================================

name: tier2

on:
  # Nightly. Off the hour on purpose: the top of the hour is the busiest slot on
  # shared runners and scheduled runs are queued, not guaranteed on time.
  schedule:
    - cron: '17 3 * * *'
  # Every tag push. Tier 1 handles branches; tags land here.
  push:
    tags:
      - 'v*'
  # Manual. Required so the lane can be exercised on demand rather than only by
  # waiting for the clock - notably right after this file changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier2-${{ github.workflow }}-${{ github.ref }}
  # NOT cancel-in-progress. A nightly or tag run that is half finished still
  # carries useful signal; cancelling it to start another wastes the minutes
  # already spent.
  cancel-in-progress: false

env:
  # CONVENTIONS.md section 10.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ===========================================================================
  # Job 1 - the full suite on both platforms, SHARDED (CS-1229).
  #
  # ONE JOB PER OS OUTGREW ITS TIMEOUT AND RAISING IT AGAIN WAS NOT THE REPAIR.
  # CS-1228 raised timeout-minutes from 30 to 50 on measurement; the first run
  # carrying that, 37125738113 at 87ea30c, still put the windows pytest step at
  # 2802s and the windows probe was cancelled at 99 per cent. So the suite runs
  # as shards.
  #
  # THE SHARDS ARE NOT A PARTITION OF THIS FILE'S OWN. Each leg runs, token for
  # token, the `Unit tests` command of the tier1.yml job its `shard` value names,
  # with one difference: the `--ignore=` of a path tests/test_tier1_budget.py
  # lists in PERMITTED_DELETIONS is dropped, because this lane is where such a
  # path is still run. That module derives both sides and is red on any drift,
  # so a file moved between shards over there moves here in the same diff or
  # not at all. Six shards, because that partition has six jobs. The sixth,
  # CS-1317's scan shard, is work the fast shard carried until then, so its
  # suite time moves off the fast legs, but each of its four new legs pays its
  # own checkout, interpreter and install, and each probe leg its own fresh
  # clone, bootstrap and hook-firing step - about 170s more runner time a
  # night, billed per job in whole minutes, the Windows legs at twice the Linux
  # rate; tools/tier2_headroom.py names its new legs in PENDING_FIRST_RECORD
  # until each is measured.
  #
  # SIZED FROM MEASURED WALLS, NOT BY FEEL. At 87ea30c the tier1.yml run
  # 37125732357 read pytest steps of fast 340s, save 370s, guards 282s, hooks
  # 291s and fill 331s on ubuntu, 1614s together; this job's ubuntu pytest step
  # read 1866s on the same tree. The 252s difference is charged whole to the
  # save shard, which carries the restored deletion, as an upper bound. The
  # windows step read 2802s against ubuntu's 1866s, a factor of 1.50, so the
  # projected windows pytest steps are fast 510s, save 933s, guards 423s, hooks
  # 437s and fill 497s, plus about 51s of job outside the step.
  # ===========================================================================
  suite:
    name: full suite (${{ matrix.os }}, ${{ matrix.shard }} shard)
    runs-on: ${{ matrix.os }}
    # Worst projected leg: windows save, 933s plus 51s, 16.4 minutes. 4/5 of
    # this value - the CS-1124 headroom tools/tier2_headroom.py grades every
    # job against - is 24.0, so the worst projected leg sits at 68 per cent
    # of that line. It is the timeout-minutes this job carried before CS-1228,
    # and it is still a runaway detector: the headroom guard reddens first when
    # a shard grows into it, and the answer then is a rebalance, not a raise.
    timeout-minutes: 30
    strategy:
      # A Windows-only failure and a Linux-only failure are different bugs, and
      # this project's primary target is Windows. Never let one abort the other.
      # Nor one shard another: a red leg must not cancel the measurement of the
      # rest.
      fail-fast: false
      matrix:
        # windows-latest is here because the character-set, path and
        # line-ending traps in CONVENTIONS.md section 10 are Windows-specific:
        # PowerShell 5.1 ANSI-decoding a BOM-less .ps1, LF-to-CRLF conversion in
        # write_text, and backslash paths in JSON config. ubuntu-latest is the
        # cheap canary and the portability check.
        os: [ubuntu-latest, windows-latest]
        # The tier1.yml job ids, one leg each. Each value selects exactly one
        # suite step below by its `if:`, and tests/test_tier1_budget.py is red
        # on a value with no step, a step with no value, or a second step.
        shard: [fast, save, guards, hooks, fill, scan]
    defaults:
      run:
        # One script for both platforms. Git Bash ships on the Windows runner.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # CS-1228 - FULL HISTORY. The default depth of 1 is a shallow clone,
          # and the CS-1222 live arm in tests/test_sha_citation_gate.py FAILS
          # rather than skips on one: this job's ubuntu leg went red on exactly
          # that arm. tests/test_full_history_checkouts.py pins this key on
          # every job whose pytest run collects that module.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install toolchain
        # The `dev` extra in pyproject.toml is the single owner of tool versions
        # (CONVENTIONS.md section 2). Editable so the suite imports the package
        # the same way it does on a developer machine.
        run: python -m pip install -e ".[dev]"

      # EXPLICIT TARGETS, never a bare recursive run from the repo root.
      # CONVENTIONS.md section 7.1: a bare root invocation can sweep runtime
      # state directories and destroy live locks or data.
      #
      # ONE STEP PER SHARD, EACH SELECTED BY ITS LEG'S `shard` VALUE, and every
      # command a literal. A command assembled at run time from a matrix value
      # could not be read by tests/test_tier1_budget.py, which grades both that
      # these are the partition and that a governed deletion is still run here.
      #
      # pytest-xdist is a HARD dependency now, from the `.[dev]` extra installed
      # above, as it already was for job 2: the opportunistic install that let
      # this job fall back to serial is gone, because a serial shard is the
      # cancellation this item exists to end, arriving silently.
      - name: Full test suite (fast shard)
        if: matrix.shard == 'fast'
        run: >-
          python -m pytest
          tests
          --ignore=tests/save
          --ignore=tests/test_hook_interpreter_ladder.py
          --ignore=tests/test_liveness.py
          --ignore=tests/test_commit_msg_gate.py
          --ignore=tests/test_pre_push_ref_race.py
          --ignore=tests/test_mypy_gate.py
          --ignore=tests/test_docs_citations.py
          --ignore=tests/test_toolpath.py
          --ignore=tests/test_precommit_gate.py
          --ignore=tests/test_chained_cause_census.py
          --ignore=tests/test_archive_rot.py
          --ignore=tests/test_sphinx_roles.py
          --ignore=tests/test_handler_exception_rendering.py
          --ignore=tests/test_locals_rendering.py
          --ignore=tests/test_assertion_rendering.py
          --ignore=tests/test_hook_probe_bound.py
          --ignore=tests/test_hook_toolchain.py
          --ignore=tests/test_precommit_gate_lint_cwd.py
          --ignore=tests/test_canary_population_forced.py
          --ignore=tests/test_cs1175_rule_narrowing.py
          --ignore=tests/test_citation_tables.py
          --ignore=tests/data/test_phase2_gate.py
          --ignore=tests/solve/test_phase3_gate.py
          --ignore=tests/test_cs1174_placeholder_delimiters.py
          --ignore=tests/test_exception_messages.py
          --ignore=tests/data/test_drift_guard_data.py
          --ignore=tests/surface/test_server.py
          --ignore=tests/test_pathless_clone_agreement.py
          --ignore=tests/test_credential_redaction.py
          --ignore=tests/test_provenance_stamp.py
          --ignore=tests/test_commit_msg_cleanup_matrix.py
          --ignore=tests/test_commit_msg_control_bytes.py
          --ignore=tests/test_pre_push_suite_floor.py
          --ignore=tests/test_precommit_index_race.py
          --ignore=tests/test_trailer_routes.py
          --ignore=tests/test_sha_citation_gate.py
          --ignore=tests/test_claude_hook.py
          --ignore=tests/test_hook_env_echo.py
          --ignore=tests/test_probe_refusal_output.py
          --ignore=tests/test_exception_rendering.py
          --ignore=tests/test_subprocess_timeouts.py
          --ignore=tests/solve/test_ceiling_fence.py
          --ignore=tests/test_canary_population.py
          --ignore=tests/test_secret_sweep.py
          --ignore=tests/test_provenance_manifest.py
          --ignore=tests/test_chained_exemption_guard.py
          --ignore=tests/test_disposition_sites.py
          --ignore=tests/test_readme_audit.py
          -q -n auto --dist loadfile --durations=15 --durations-min=5.0

      - name: Full test suite (save shard)
        if: matrix.shard == 'save'
        run: >-
          python -m pytest
          tests/test_toolpath.py
          tests/test_trailer_routes.py
          tests/test_sha_citation_gate.py
          tests/save
          -q -n auto --dist loadfile --durations=15 --durations-min=5.0

      - name: Full test suite (guards shard)
        if: matrix.shard == 'guards'
        run: >-
          python -m pytest
          tests/test_claude_hook.py
          tests/test_hook_env_echo.py
          tests/test_docs_citations.py
          tests/test_chained_cause_census.py
          tests/test_archive_rot.py
          tests/test_sphinx_roles.py
          tests/test_handler_exception_rendering.py
          tests/test_locals_rendering.py
          tests/test_assertion_rendering.py
          -q -n auto --dist loadfile --durations=15 --durations-min=5.0

      - name: Full test suite (hooks shard)
        if: matrix.shard == 'hooks'
        run: >-
          python -m pytest
          tests/test_hook_probe_bound.py
          tests/test_canary_population_forced.py
          tests/test_hook_interpreter_ladder.py
          tests/test_commit_msg_gate.py
          tests/test_precommit_gate.py
          tests/test_pre_push_ref_race.py
          tests/test_hook_toolchain.py
          tests/test_precommit_gate_lint_cwd.py
          tests/test_commit_msg_cleanup_matrix.py
          tests/test_commit_msg_control_bytes.py
          tests/test_pre_push_suite_floor.py
          tests/test_precommit_index_race.py
          tests/test_exception_rendering.py
          tests/test_subprocess_timeouts.py
          tests/solve/test_ceiling_fence.py
          tests/test_canary_population.py
          -q -n auto --dist loadfile --no-loadscope-reorder --durations=15 --durations-min=5.0

      - name: Full test suite (fill shard)
        if: matrix.shard == 'fill'
        run: >-
          python -m pytest
          tests/test_cs1175_rule_narrowing.py
          tests/test_citation_tables.py
          tests/data/test_phase2_gate.py
          tests/solve/test_phase3_gate.py
          tests/test_cs1174_placeholder_delimiters.py
          tests/test_exception_messages.py
          tests/data/test_drift_guard_data.py
          tests/surface/test_server.py
          tests/test_pathless_clone_agreement.py
          tests/test_credential_redaction.py
          tests/test_provenance_stamp.py
          tests/test_liveness.py
          tests/test_mypy_gate.py
          tests/test_probe_refusal_output.py
          tests/test_secret_sweep.py
          -q -n auto --dist loadfile --durations=15 --durations-min=5.0

      - name: Full test suite (scan shard)
        if: matrix.shard == 'scan'
        run: >-
          python -m pytest
          tests/test_provenance_manifest.py
          tests/test_chained_exemption_guard.py
          tests/test_disposition_sites.py
          tests/test_readme_audit.py
          -q -n auto --dist loadfile --durations=15 --durations-min=5.0

  # ===========================================================================
  # Job 2 - THE CLEAN-CHECKOUT PROBE. The highest-value job in this file.
  #
  # CONVENTIONS.md section 1: a fresh clone has NO local wiring. Git hooks, MCP
  # config and local settings are all untracked or local-config, so a new clone
  # runs ZERO protection until someone wires it. CONVENTIONS.md section 8 says
  # this probe is the only thing that catches "works on my machine" wiring.
  #
  # The shape matters: check out into ./source, then CLONE FRESH into ./probe and
  # do all the work there. Running the bootstrap in the checkout itself would
  # prove nothing, because the checkout is not the thing a new contributor gets.
  # ===========================================================================
  clean-checkout-probe:
    name: clean-checkout probe (${{ matrix.os }}, ${{ matrix.shard }} shard)
    runs-on: ${{ matrix.os }}
    # CS-1229 - SHARDED EXACTLY AS JOB 1, and for the same measurement: the
    # windows leg was CANCELLED at the 50 cutoff CS-1228 set, at 99 per cent,
    # on run 37125738113. On that run the ubuntu probe pytest step read 1960s
    # against job 1's 1866s, a factor of 1.05, and the windows steps outside it
    # took about 63s. So the worst projected leg, windows save, is 933s times
    # 1.05 plus 63s, 17.4 minutes, at 73 per cent of the 24.0 that 4/5 of this
    # value puts the headroom line at. Every leg runs the whole bootstrap and
    # both firing and wiring steps - they are seconds - and only its own shard
    # of the suite, so no leg of the probe is a lesser probe.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both platforms. Hook wiring is where the platform-specific traps live:
        # core.hooksPath is keyed by path STRING, so C:\X, C:/X and C:/x are three
        # separate entries (CONVENTIONS.md section 16 item 3). CRLF in a hook is
        # the other classic trap - measured 2026-08-13 as tolerated by Git for
        # Windows' bundled bash, but dash and ash on this POSIX runner are stricter,
        # which is exactly why the probe runs on both platforms.
        os: [ubuntu-latest, windows-latest]
        # The same six values as job 1, graded by the same arm.
        shard: [fast, save, guards, hooks, fill, scan]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout (the source the fresh clone is taken from)
        uses: actions/checkout@v5
        with:
          path: source
          # Full history so the local clone below is an ordinary clone rather
          # than a clone of a shallow repository.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: source/pyproject.toml

      - name: Clone fresh into a separate directory
        run: |
          git clone --no-hardlinks ./source ./probe
          echo "fresh clone created at ./probe"

      # =====================================================================
      # THE TRACKED INDEX MODE, MEASURED BEFORE THE BOOTSTRAP CAN REPAIR IT.
      #
      # THIS STEP'S POSITION IS THE ENTIRE POINT AND MUST NOT BE MOVED.
      # `scripts/install_hooks.py::set_executable` ORs the exec bits in
      # unconditionally on POSIX, so ANY exec-bit check placed after Bootstrap
      # 1/3 is reading what the installer just wrote, not what the checkout
      # materialised from the index. A hook tracked at 100644 would be chmodded
      # to 0755 by the bootstrap and every later check would pass - which is
      # exactly the blind spot CS-923 existed to close, silently reopened.
      #
      # The first cut of the CS-924 arm made that mistake and claimed "at its
      # tracked mode" from a check that ran 567 log lines after the installer.
      # An adversary refuted it. This step is the repair, and it is placed here
      # rather than fixed in words.
      #
      # ALL THREE HOOKS, not just pre-commit. CS-923 flipped three index
      # entries; a loop over one of them grades one third of the change. git
      # silently declines a non-executable hook, so a commit-msg that never
      # runs is invisible to any commit that would otherwise succeed.
      # =====================================================================
      - name: Assert the tracked index mode BEFORE the bootstrap can repair it
        working-directory: probe
        run: |
          set -u
          FAIL=0

          echo "index modes as recorded by git:"
          git ls-files -s .githooks/

          for hook in pre-commit commit-msg pre-push; do
            MODE="$(git ls-files -s ".githooks/$hook" | awk '{print $1}')"
            if [ -z "$MODE" ]; then
              echo "FAIL: .githooks/$hook is not tracked at all."
              FAIL=1
              continue
            fi
            if [ "$MODE" != "100755" ]; then
              echo "FAIL: .githooks/$hook is tracked at $MODE, not 100755."
              echo "git materialises a checkout at the INDEX mode, so on every"
              echo "POSIX clone this hook lands non-executable. git then"
              echo "declines to run it AND SAYS NOTHING - the tier-0 gate is"
              echo "silently absent. This is CS-923."
              FAIL=1
            else
              echo "OK: .githooks/$hook tracked at 100755."
            fi
          done

          # And what the checkout ACTUALLY produced on this filesystem, which is
          # the half a mode in the index cannot promise on its own.
          case "$(uname -s 2>/dev/null || echo unknown)" in
            MINGW*|MSYS*|CYGWIN*)
              echo "NOTE: Git for Windows masks X_OK - the materialised bit is"
              echo "unmeasurable on this leg. The ubuntu leg measures it."
              ;;
            *)
              for hook in pre-commit commit-msg pre-push; do
                if [ ! -x ".githooks/$hook" ]; then
                  echo "FAIL: .githooks/$hook materialised NON-EXECUTABLE from"
                  echo "a clean clone, before any bootstrap ran."
                  FAIL=1
                else
                  echo "OK: .githooks/$hook materialised executable from the index."
                fi
              done
              ;;
          esac

          if [ "$FAIL" -eq 0 ]; then
            echo ""
            echo "OK: all three hooks are tracked at 100755 and materialise"
            echo "executable from a clean clone, measured BEFORE the bootstrap."
          fi
          exit "$FAIL"

      # --- Assertion 1: the fresh clone runs zero protection. ---
      # This half of the pair is what makes the other half meaningful. Without
      # it, a runner that somehow inherited core.hooksPath would let the
      # post-bootstrap assertion pass while proving nothing about install_hooks.
      - name: Assert core.hooksPath is NOT set before the bootstrap
        working-directory: probe
        run: |
          if git config --get core.hooksPath > /dev/null 2>&1; then
            echo "FAIL: core.hooksPath is already set in a freshly cloned repo."
            echo "Either the clone inherited config it should not have, or the"
            echo "value is tracked somewhere it must not be. Either way this"
            echo "probe can no longer prove install_hooks.py does anything."
            exit 1
          fi
          echo "OK: core.hooksPath is unset in the fresh clone, as expected."
          echo "CONVENTIONS.md section 1 - a new clone runs zero protection."

      - name: Install the toolchain INTO the fresh clone
        working-directory: probe
        # Order matters and is deliberate: toolchain first, bootstrap second.
        # That is what a human does on a new machine, and scripts/verify_env.py
        # exists to ASSERT the toolchain is present, not to install it. Doing it
        # in this order means a verify_env failure below is a real finding rather
        # than one this workflow inflicted on itself.
        #
        # Installed from the clone's own pyproject.toml, not from ./source, so
        # nothing about this probe depends on the prepared checkout next door.
        run: python -m pip install -e ".[dev]"

      # --- Bootstrap step 1 of 3 (CONVENTIONS.md section 1, exact order). ---
      - name: Bootstrap 1/3 - install_hooks.py
        working-directory: probe
        run: python scripts/install_hooks.py

      # --- Assertion 2: the bootstrap actually wired the hooks. ---
      - name: Assert core.hooksPath IS set after install_hooks.py
        working-directory: probe
        run: |
          set +e
          HOOKS_PATH="$(git config --get core.hooksPath)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ -z "$HOOKS_PATH" ]; then
            echo "FAIL: core.hooksPath is NOT set after install_hooks.py ran."
            echo "CONVENTIONS.md section 1 requires install_hooks.py to fail"
            echo "loudly when it cannot set core.hooksPath. It exited zero and"
            echo "left the repo unprotected, which is the worse outcome."
            exit 1
          fi
          echo "core.hooksPath = $HOOKS_PATH"
          if [ ! -d "$HOOKS_PATH" ]; then
            echo "FAIL: core.hooksPath points at a directory that does not exist."
            exit 1
          fi
          echo "OK: core.hooksPath is set and the directory it names exists."
          # PRESENCE IS NOT FIRING. CONVENTIONS.md section 16 item 4: the only
          # valid proof a hook fires is end to end - stage a violation, attempt a
          # REAL commit, assert HEAD is unchanged. THIS step still proves only
          # WIRING; the end-to-end proof is the last step of this job, added by
          # CS-924. Do not read this assertion as evidence any hook runs.
          echo "NOTE: this asserts hook WIRING, not hook FIRING."
          echo "The firing proof is the last step of this job - see CS-924."

      # --- Bootstrap step 2 of 3. ---
      # EXPECTED ON A CI RUNNER: verify_env.py reports the game install as
      # MISSING, because no runner has the game. That must NOT fail this job.
      # The contract (CONVENTIONS.md section 1) is that verify_env.py exits
      # non-zero only on a missing HARD dependency, and the game install is not
      # one for the test suite - BOOTSTRAP.md section 8.1 requires the suite to
      # run green with no game installed and no save file present.
      # So this step is BLOCKING on purpose: if it goes red here, either a hard
      # dependency really is missing or verify_env.py has misclassified the game
      # install as hard. Both are real bugs. Do not paper over either one by
      # adding continue-on-error to this step.
      # `--json` is available on this tool if a machine-readable record is ever
      # wanted; the default table is what a human reads in the run log.
      - name: Bootstrap 2/3 - verify_env.py (game install MISSING is expected)
        working-directory: probe
        run: python scripts/verify_env.py

      # --- Bootstrap step 3 of 3. ---
      # A fresh clone has no semantic recall store: it is local and gitignored
      # (CONVENTIONS.md section 11.2), so on a runner there is nothing to mirror
      # into. memory_sync.py must degrade cleanly in that case. This step is
      # blocking for the same reason as the one above - if it exits non-zero on a
      # clean machine, that is a wiring defect in the tool, and swallowing it
      # here would hide exactly the failure this probe exists to find.
      - name: Bootstrap 3/3 - memory_sync.py
        working-directory: probe
        run: python tools/memory_sync.py

      # --- And finally: does the suite run in a clone nobody prepared? ---
      #
      # THE WHOLE SUITE, NOT A SUBSET, because this step is not a duplicate of
      # job 1. It is the only lane that runs the suite AFTER the bootstrap, so
      # it is the only one where an environment-shaped arm takes its wired
      # branch - tests/test_make_cert.py names this job as the one that does.
      # WHOLE ACROSS THE LEGS SINCE CS-1229: each leg runs one shard, the same
      # command as job 1's step for that shard, and the five together are the
      # whole suite - the partition argument job 1's header states.
      #
      # `-n auto`, THE SAME PARALLELISM AS JOB 1. This step ran serially until
      # three consecutive windows-latest legs were CANCELLED at this job's
      # 30-minute cutoff (runs 35163459856, 35173614671, 35177278852, the last
      # at 98 per cent with nothing failed). Measured over 30 tier2 runs
      # 2026-09-01..2026-09-17: the serial step here was slower than job 1's
      # `-n auto` step on windows-latest in 26 of 30 same-tree pairings. On
      # ubuntu-latest the pairing is mixed, and the flag is applied to both
      # legs anyway so this invocation stays identical to job 1's.
      # The cutoff was NOT raised for that incident: it is a runaway detector,
      # and the suite's growth is the signal it exists to surface. CS-1228 is
      # that signal arriving - nine nights cancelled with nothing failed - and
      # CS-1229 answered it with shards rather than a second raise, sized at
      # timeout-minutes above from measured walls. Each command is identical
      # to job 1's for the same shard. pytest-xdist comes from the
      # clone's own `.[dev]` extra installed above - no extra install here, so
      # a clone whose pyproject lost it goes red rather than quietly serial.
      - name: Suite in the fresh clone (fast shard)
        if: matrix.shard == 'fast'
        working-directory: probe
        run: >-
          python -m pytest
          tests
          --ignore=tests/save
          --ignore=tests/test_hook_interpreter_ladder.py
          --ignore=tests/test_liveness.py
          --ignore=tests/test_commit_msg_gate.py
          --ignore=tests/test_pre_push_ref_race.py
          --ignore=tests/test_mypy_gate.py
