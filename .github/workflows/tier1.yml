# =============================================================================
# Clockspeed - CI tier 1: the fast lane.
#
# CONVENTIONS.md section 8: tier 1 runs on every push and is "the lane that must
# never be red". This file is the ONE owner of how long that is allowed to take
# - the env block below states it, and nothing else in the repository restates
# it (CS-896). tools/drift_guard.py guard (k) holds that.
#
# LEANNESS IS A REQUIREMENT, NOT A STYLE CHOICE. This repo is private and CI
# minutes are metered (CONVENTIONS.md section 8, budget note), so this lane uses
# the cheapest runner, one interpreter and one dependency install PER SHARD. It
# runs TWO jobs and once ran one - the reason, and the measurement that forced
# it, are on the second job below. Everything expensive - the Windows runner,
# the clean-checkout probe, the audits - lives in tier2.yml, nightly and on tag.
#
# CLEAN-MACHINE INVARIANT. BOOTSTRAP.md section 8.1: test fixtures are small
# synthetic registries hand-authored in the repo, never slices of real game
# data, precisely so the suite runs on a machine with no game installed and no
# save file present. Nothing in this workflow may expect the game install, the
# save directory, or any publisher-owned asset to exist. No step here compensates
# for a missing game, and no step swallows a non-zero exit to hide one.
# =============================================================================

name: tier1

on:
  # Every branch. Tag pushes deliberately do NOT land here - a tag is tier 2.
  push:
    branches:
      - '**'
  # Same-repo pull requests fire both `push` and `pull_request`. The duplicate is
  # kept on purpose: the `pull_request` run tests the MERGE result, which the
  # `push` run (which tests the head commit) does not. The concurrency block
  # below is the cost control instead.
  pull_request:

# Least privilege. Tier 1 only reads the tree.
permissions:
  contents: read

# Cancel superseded runs on the same ref. On a metered private repo this is the
# single largest saving available for a lane that fires on every push.
concurrency:
  group: tier1-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CONVENTIONS.md section 10: set these so subprocess output does not mojibake.
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

  # -- THE ONE OWNER OF THIS LANE'S DURATION LEVELS (CS-896). --
  #
  # THREE LEVELS, THREE DIFFERENT JOBS. Do not collapse them into one:
  #
  #   budget   REPORTED every run. Over it WARNS loudly. Does NOT fail. This
  #            lane "must never be red", and the runner's own spread is wide
  #            on a BYTE-IDENTICAL tree, so a budget that hard-failed on noise
  #            would be red for no defect.
  #            tools/doc_budget.py is the precedent and its header states the
  #            reason: "a warn that blocks a commit gets disabled and then
  #            enforces nothing".
  #   ceiling  FAILS the lane, naming the number, strictly BELOW the cutoff.
  #            This is the level that converts a breach into an actionable red
  #            instead of a cancellation that says nothing.
  #   cutoff   The job's runaway timeout. It CANCELS. It is POLICY and not a
  #            tunable - see the note beside it, and guard (k).
  #
  # THE DERIVATION IS WRITTEN OUT so the next person re-derives rather than
  # guesses, which is what nobody did last time. THE FULL SAMPLE IS SIX
  # READINGS of the pytest step, every one taken on a GitHub 2-vCPU runner
  # (nproc 2) against ONE byte-identical tree:
  #
  #   serial    541.68, 590.82                     (whole job 582, 631)
  #   -n auto   424.18, 475.98, 483.14, 470.67
  #
  # MEAN TO MEAN THAT IS 1.222x, AND THE RANGE IS THE PART THAT MATTERS. The
  # pessimistic pair gives 1.121x; the flattering pair gives 1.393x. QUOTE THE
  # MEAN OR THE PESSIMISTIC PAIR AND NEVER THE FLATTERING ONE - a speedup taken
  # from the best pair is one the lane delivers only on its best day, and every
  # ordinary run afterwards then reads as a regression that is not one.
  #
  # THE BUDGET IS SET FROM THE WORST OBSERVED JOB, NOT FROM A RATIO, because a
  # ratio applied to a mean discards exactly the tail this lane trips over. The
  # pytest step is about 94 per cent of the job and every other step totals
  # roughly 36 seconds, so the slowest parallel reading above is a job of about
  # 519. The budget sits 21 above that worst observation, and exactly 60 below
  # the cutoff - the next minute of growth, which is the item note's own
  # language for the headroom this lane may spend before somebody has to look.
  #
  # THE CEILING LEAVES 30 UNDER THE CUTOFF, which is what makes the ceiling -
  # and not the canceller - the thing a slow run meets first.
  #
  # BOTH NUMBERS ARE RATCHETED IN BOTH DIRECTIONS by tools/drift_guard.py guard
  # (k) against maxima recorded there, so raising OR lowering either one here
  # alone turns the guard red. That is deliberate. CS-896 exists because this
  # lane drifted past its stated target with nothing failing, and a level
  # nobody has to defend inside a diff is a level that drifts again.
  TIER1_BUDGET_SECONDS: '540'
  TIER1_CEILING_SECONDS: '570'

jobs:
  fast:
    name: gates, lint, types, tests
    runs-on: ubuntu-latest
    # THE RUNAWAY CUTOFF, AND IT IS NOT A BUDGET. A hung step must stop burning
    # metered minutes rather than reach the six-hour default. It CANCELS, and a
    # cancelled run is evidence of NOTHING: nothing failed, nothing was
    # measured, and the session that sees it reads flakiness.
    #
    # DO NOT RAISE THIS TO ACCOMMODATE A SLOWER LANE. That converts a runaway
    # detector into a budget and removes the only signal that the lane is
    # growing. The ceiling in the env block is what fails a slow lane, and it
    # sits BELOW this number precisely so a breach meets it first.
    #
    # AND SOMETHING NOW ENFORCES THAT SENTENCE. It used to be capitals and
    # nothing else: raising this alone left every guard and every arm green,
    # which is the same shape of silence CS-896 was filed about one level up.
    # tools/drift_guard.py guard (k) PINS this as policy rather than reading it
    # as a tunable, so any change to it - up or down - is red until the pin
    # moves with it in the same diff and somebody says why.
    timeout-minutes: 10
    defaults:
      run:
        # Declared explicitly rather than relying on the implicit default. The
        # implicit shell is `bash -e`; naming it gets `bash -eo pipefail`, so a
        # failure on the left-hand side of a pipe cannot be masked by a
        # successful right-hand side.
        shell: bash

    steps:
      # FIRST, AND AHEAD OF CHECKOUT ON PURPOSE. A `run:` step needs no repo,
      # and starting the clock here is what makes the reading a JOB duration
      # rather than a duration of whichever part someone remembered to wrap.
      - name: Record the start
        run: echo "TIER1_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        # Shallow on purpose. Tier 1 gates the working tree. Full history is
        # tier 3's job (CONVENTIONS.md section 17 item 1 - history is what leaks).

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Single version by design - see the leanness note in the header.
          # 3.14 matches the interpreter this project is pinned to; the
          # authoritative assertion lives in scripts/verify_env.py, not here.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install toolchain
        # ONE owner for the tool versions: the `dev` extra in pyproject.toml,
        # which pins ruff, pytest and mypy. Naming versions again here would be a
        # restated fact, and a restated fact is a fact that will drift
        # (CONVENTIONS.md section 2).
        #
        # Editable install rather than a bare `pip install ruff pytest mypy`, for
        # two reasons: it puts clockspeed on sys.path the way a developer machine
        # has it, and it exercises the dynamic-version wiring in pyproject.toml,
        # so a packaging break surfaces on the fast lane instead of at the first
        # release tag.
        run: python -m pip install -e ".[dev]"

      # -- Gate 1: character set. The CI mirror of the tier-0 pre-commit gate. --
      # Mode choice: `--files` with the full tracked-file list, NOT `--staged`.
      # A CI checkout has an empty index relative to HEAD, so `--staged` would
      # inspect nothing and report a green pass over zero files - exactly the
      # "unrun gate" failure class in CONVENTIONS.md section 7.2. `--files` over
      # `git ls-files` gates the whole tracked tree on every run, which is a
      # strictly stronger check than the local hook performs.
      #
      # `--list-skipped` is not decoration. CONVENTIONS.md section 15.1: "a guard
      # can be green while self-excusing - skipping itself on the very files it
      # is meant to cover. Read what the guard skips." This prints that list into
      # the run log every push, at no extra cost, so the skip set is auditable
      # rather than assumed.
      - name: Character-set gate over all tracked files
        run: |
          mapfile -d '' TRACKED < <(git ls-files -z)
          if [ "${#TRACKED[@]}" -eq 0 ]; then
            echo "FAIL: git ls-files returned nothing."
            echo "Refusing to report a pass over an empty file set."
            exit 1
          fi
          echo "gating ${#TRACKED[@]} tracked files"
          python tools/precommit_gate.py --list-skipped --files "${TRACKED[@]}"

      # -- Gate 2: lint. --
      - name: Lint (ruff check)
        run: python -m ruff check .

      # -- Gate 3: formatting. --
      # Kept blocking rather than advisory. It is deterministic, it is repaired by
      # one command (`python -m ruff format .`), and a formatting gate that never
      # fails is a formatting gate nobody obeys. Configuration is owned by
      # pyproject.toml, not by this file.
      - name: Format check (ruff format --check)
        run: python -m ruff format --check .

      # -- Gate 4: documentation size budgets (CONVENTIONS.md section 2.1). --
      # The tool owns which budgets are hard-fail and which are warn; this step
      # only reports its exit code.
      - name: Doc size budgets
        run: python tools/doc_budget.py

      # -- Gate 5: drift. --
      - name: Drift guard
        run: python tools/drift_guard.py

      # -- Gate 6: markdown cross-references (CONVENTIONS.md section 17 item 6). --
      # Inline Python on purpose: no third-party action, so no new supply-chain
      # dependency and nothing to run through the section 14 license gate.
      # Scope: relative links only. External URLs are NOT fetched - a network
      # check would make the lane flaky, and "must never be red" outranks
      # catching a dead external link here.
      - name: Markdown link check
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          ROOT = Path.cwd()
          listing = subprocess.run(
              ["git", "ls-files", "-z", "*.md"],
              capture_output=True, text=True, check=True,
          ).stdout
          files = sorted({ROOT / p for p in listing.split("\0") if p})
          if not files:
              print("FAIL: no tracked markdown files found.")
              print("Refusing to report a pass over an empty file set.")
              sys.exit(1)

          FENCE = re.compile(r"^\s{0,3}(```|~~~)")
          INLINE = re.compile(r"\[[^\]]*\]\(\s*<?([^)>\s]+)>?(?:\s+[\"'(][^)]*)?\s*\)")
          REFDEF = re.compile(r"^\s{0,3}\[[^\]]+\]:\s*<?([^\s>]+)>?")
          SCHEME = re.compile(r"^[A-Za-z][A-Za-z0-9+.\-]*:")

          failures = []
          checked = 0
          for md in files:
              text = md.read_text(encoding="utf-8", errors="replace")
              in_fence = False
              for lineno, line in enumerate(text.splitlines(), 1):
                  if FENCE.match(line):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  bare = re.sub(r"`[^`]*`", "", line)
                  targets = list(INLINE.findall(bare))
                  ref = REFDEF.match(bare)
                  if ref:
                      targets.append(ref.group(1))
                  for raw in targets:
                      target = raw.strip()
                      if not target:
                          continue
                      if target.startswith("#") or target.startswith("//"):
                          continue
                      if SCHEME.match(target):
                          continue
                      path_part = unquote(target.split("#", 1)[0])
                      if not path_part:
                          continue
                      if path_part.startswith("/"):
                          candidate = ROOT / path_part.lstrip("/")
                      else:
                          candidate = md.parent / path_part
                      checked += 1
                      if not candidate.exists():
                          rel = md.relative_to(ROOT).as_posix()
                          failures.append(
                              rel + ":" + str(lineno) + ": unresolved -> " + target
                          )

          print("markdown files scanned: " + str(len(files)))
          print("relative cross-references checked: " + str(checked))
          if failures:
              print("UNRESOLVED RELATIVE MARKDOWN LINKS:")
              print("CONVENTIONS.md section 17 item 6 - no orphaned or stale markdown.")
              for item in failures:
                  print("  " + item)
              sys.exit(1)
          print("all relative markdown cross-references resolve")
          PY

      # -- Gate 7: types. BLOCKING as of the phase-3 ratchet step. --
      # Invoked bare, with no target, so pyproject.toml owns what is checked -
      # its mypy `files` key already names the package and the suite. Naming a
      # target here would be a second copy of that list, and the second copy is
      # the one that drifts (CONVENTIONS.md section 2).
      #
      # It was advisory for phase 0 and phase 1, because the package was a
      # skeleton and blocking would have held this lane red - and CONVENTIONS.md
      # section 8 says this lane must never be red. That reason has expired.
      # pyproject.toml now carries both owed ratchet rungs as real override
      # blocks: disallow_untyped_defs on clockspeed.data.*, and the expanded
      # constituents of strict on clockspeed.solve.*.
      #
      # The flip is what makes the ratchet a gate rather than a note. Advisory,
      # a strict-violating solve module would not turn this lane red, and the
      # exact-arithmetic invariant the strict rung exists to protect
      # (non-negotiable 6) would be guarded by a check nobody has to pass.
      # Measured free at the moment of the flip: `python -m mypy` exits 0.
      #
      # Invoked bare, with no target, so pyproject.toml owns what is checked -
      # its mypy `files` key already names the package and the suite. Naming a
      # target here would be a second copy of that list, and the second copy is
      # the one that drifts (CONVENTIONS.md section 2).
      #
      # DO NOT reintroduce `continue-on-error` to get a red lane green. A type
      # error is fixed or the rung is lowered deliberately in pyproject.toml
      # with a recorded reason; silencing the reporter is neither.
      - name: Type check
        run: python -m mypy

      # -- Gate 8: the suite. --
      # EXPLICIT TARGET DIRECTORY, never a bare recursive invocation from the
      # repo root. CONVENTIONS.md section 7.1 records why: a bare root run can
      # sweep runtime state directories and destroy live locks or data. The rule
      # is written for the developer machine, and the invocation is kept
      # identical here so CI and local never diverge.
      #
      # `-n auto` WITH NO `--dist` FLAG, because tier2.yml already runs exactly
      # that and it is therefore this repo's proven invocation. `--dist
      # loadfile` has never run here, and adopting an unmeasured scheduler to
      # fix a timing problem trades one unknown for another.
      #
      # MEASURED, not assumed. The six-reading sample and its range live in the
      # env block above; this step is what the sample was taken from.
      #
      # CS-448 IS OPEN, IT IS TIER 1, AND IT IS ABOUT THIS EXACT FLAG. So "tier
      # 2 already runs it" is NOT the argument that clears it, and CS-448's own
      # note refuses that argument in as many words: a green tier-2 run is not
      # the measurement the item asks for, because the flake may simply not
      # have fired. The item root-caused the mechanism instead, and it is the
      # CHECKOUT LOCATION rather than contention - a checkout sharing a large
      # ancestor with the temp root makes pytest's rootdir climb, so collection
      # walks the whole temp tree.
      #
      # SO THE PRECONDITION WAS MEASURED ON THE RUNNER, AND IT DOES NOT HOLD
      # THERE. The checkout is work/Clockspeed/Clockspeed under the runner
      # account's own home directory (the absolute form is deliberately not
      # spelled here - tools/precommit_gate.py blocks an absolute home path,
      # and rightly). tempfile.gettempdir() is /tmp, holding 14 entries. The
      # common ancestor of the two is the filesystem root, so the checkout is
      # NOT under the temp root and the rootdir climb CANNOT happen on this
      # runner. Four full-suite -n auto runs there were green at 4784 passed
      # and 117 skipped every time, identical to serial - corroboration of a
      # measured mechanism, not the green-run evidence CS-448 refused.
      #
      # THAT DISCHARGES THE PRECONDITION HERE AND DOES NOT CLOSE CS-448, which
      # is about the developer machine, where the checkout and the temp root DO
      # share an ancestor. Read docs/item_notes.md under CS-448 before changing
      # this line.
      #
      # ONE SKIP SWAPS AND IT IS NOT A REGRESSION. tests/test_tmp_path_privacy.py
      # skips a different arm under each scheduler: serial skips the arm that
      # needs pytest-xdist, parallel skips the arm that is inconclusive when the
      # tree is not clean. Totals unchanged. Do not read the swap as a defect.
      #
      # pytest-xdist is a HARD dependency, pinned in the `dev` extra beside
      # every other tool and installed by the step above. tier2.yml installs it
      # opportunistically and tolerates its absence; this lane must NOT, because
      # silently falling back to serial puts it back over the cutoff while
      # saying nothing about why.
      # `--durations` IS THE HALF CS-896 KEPT ASKING FOR AND NEVER HAD. The lane
      # already reports how long it took; until now it never reported WHERE the
      # time went, so every investigation began by pushing a diagnostic branch to
      # find out. The item's note refuses a local profile in terms - the runner is
      # roughly 2x slower for subprocess-heavy work - so the profile has to be
      # taken here or not at all. It costs nothing: pytest already times every
      # test, and the threshold keeps the sub-5s tail out of the log.
      - name: Unit tests
        run: >-
          python -m pytest tests --ignore=tests/save -q -n auto
          --durations=15 --durations-min=5.0

      # -- The comparison CS-896's acceptance clause asks for. --
      # `if: always()` is the load-bearing half. A comparison that ran only when
      # every earlier step succeeded would report nothing on exactly the runs
      # worth measuring.
      #
      # THE JOB START TIME IS NOT QUERIED FROM THE API, and that was considered
      # and REFUSED: it needs `actions: read`, and the permissions block above
      # states `contents: read` under "Least privilege. Tier 1 only reads the
      # tree." A duration reading does not justify widening what this lane sees.
      #
      # THREE REFUSALS, NOT ONE, AND THE OTHER TWO WERE MEASURED HOLES. This
      # step reports a number it computed, so every way that number can be
      # meaningless has to end in a refusal rather than in a cheerful verdict:
      #
      #   no start        the original refusal. Nothing to subtract from.
      #   not an integer  MEASURED: TIER1_STARTED="1 2" made bash print a
      #                   syntax error to stderr, leave ELAPSED EMPTY, and
      #                   still exit 0 - reporting a duration of nothing as
      #                   though it were within budget.
      #   negative        MEASURED: a start in the future produced
      #                   "tier 1 took -9999s - within budget" and exit 0. A
      #                   clock that ran backwards is not a fast lane.
      #
      # All three print the same sentence, because they are the same fault:
      # this job did not measure the thing it is about to report.
      - name: Duration against the budget
        if: always()
        run: |
          if [ -z "${TIER1_STARTED:-}" ]; then
            echo "FAIL: no start was recorded, so there is nothing to compare against."
            echo "Refusing to report a duration this job did not measure."
            exit 1
          fi
          case "$TIER1_STARTED" in
            *[!0-9]*)
              echo "FAIL: the recorded start is not a whole number of seconds."
              echo "Refusing to report a duration this job did not measure."
              exit 1
              ;;
          esac
          ELAPSED=$(( $(date +%s) - TIER1_STARTED ))
          if [ "$ELAPSED" -lt 0 ]; then
            echo "FAIL: the clock ran backwards - elapsed came out as ${ELAPSED}s."
            echo "Refusing to report a duration this job did not measure."
            exit 1
          fi
          BUDGET="$TIER1_BUDGET_SECONDS"
          CEILING="$TIER1_CEILING_SECONDS"
          if [ "$ELAPSED" -gt "$CEILING" ]; then
            VERDICT="OVER THE CEILING"
          elif [ "$ELAPSED" -gt "$BUDGET" ]; then
            VERDICT="over budget"
          else
            VERDICT="within budget"
          fi
          LINE="tier 1 took ${ELAPSED}s - ${VERDICT}"
          DETAIL="budget ${BUDGET}s, ceiling ${CEILING}s"
          echo "${LINE} (${DETAIL})"
          {
            echo "### tier 1 duration"
            echo ""
            echo "| level | seconds |"
            echo "| --- | --- |"
            echo "| elapsed | ${ELAPSED} |"
            echo "| budget | ${BUDGET} |"
            echo "| ceiling | ${CEILING} |"
            echo ""
            echo "${LINE} (${DETAIL})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt "$CEILING" ]; then
            echo "::error::${LINE} (${DETAIL})"
            echo "The ceiling sits BELOW the runaway cutoff on purpose, so this is a"
            echo "failure naming a number rather than a cancellation naming none."
            exit 1
          fi
          if [ "$ELAPSED" -gt "$BUDGET" ]; then
            echo "::warning::${LINE} (${DETAIL})"
            echo "Over budget is a REPORT, not a failure - the lane must never be red"
            echo "for runner noise. The ceiling is what fails it."
          fi

  # -- THE SECOND SHARD, AND THE REASON THE LANE HAS TWO. --
  #
  # MEASURED 2026-09-06: run 34013336391 was CANCELLED at 611s, at 99 per cent of
  # the suite, with NOTHING FAILING. The lane had reached the runaway cutoff, and a
  # cancelled run is evidence of nothing - which is the exact condition CS-896 was
  # filed about, arriving one level worse than the ceiling breach that preceded it.
  #
  # THE CUTOFF WAS NOT RAISED AND MUST NOT BE. It is policy, guard (k) pins it, and
  # the note beside it says so in capitals. With the cutoff fixed the only remaining
  # move is to give the work more than one runner, so the suite is SPLIT rather than
  # trimmed: every test that ran before still runs on every push, in one shard or the
  # other, and no test moved to a slower lane. Coverage is unchanged BY CONSTRUCTION
  # rather than by argument.
  #
  # THIS COSTS THE LEANNESS RULE IN THE HEADER, KNOWINGLY. That rule asks for one
  # runner and no matrix because minutes are metered. Two jobs pay a second checkout
  # and a second install - about 35 seconds - to halve a step that had stopped
  # finishing at all. Operator decision, 2026-09-06.
  #
  # THE SPLIT IS A PARTITION AND tests/test_tier1_budget.py HOLDS IT THERE. This job
  # runs tests/save; the job above runs tests with tests/save ignored. A shard that
  # silently stopped covering a directory would be green over nothing, which is the
  # unrun-gate failure class, so the two invocations are asserted to partition the
  # suite rather than merely to look like they do.
  #
  # NO GATES HERE. The character set, lint, format, doc budget, drift, link and type
  # gates all read the WHOLE TREE, so running them again in this job would measure
  # the same bytes twice and pay twice for it. They belong to the job above.
  save:
    name: tests (save shard)
    runs-on: ubuntu-latest
    # THE SAME CUTOFF AS THE JOB ABOVE, for the same reason, and guard (k) pins this
    # one too. A shard is not a licence to run long.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Record the start
        run: echo "TIER1_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install toolchain
        run: python -m pip install -e ".[dev]"

      # THE OTHER HALF OF THE PARTITION. Explicit target directory, never a bare
      # recursive invocation from the repo root - CONVENTIONS.md section 7.1.
      - name: Unit tests
        run: python -m pytest tests/save -q -n auto --durations=15 --durations-min=5.0

      - name: Duration against the budget
        if: always()
        run: |
          if [ -z "${TIER1_STARTED:-}" ]; then
            echo "FAIL: no start was recorded, so there is nothing to compare against."
            echo "Refusing to report a duration this job did not measure."
            exit 1
          fi
          case "$TIER1_STARTED" in
            *[!0-9]*)
              echo "FAIL: the recorded start is not a whole number of seconds."
              echo "Refusing to report a duration this job did not measure."
              exit 1
              ;;
          esac
          ELAPSED=$(( $(date +%s) - TIER1_STARTED ))
          if [ "$ELAPSED" -lt 0 ]; then
            echo "FAIL: the clock ran backwards - elapsed came out as ${ELAPSED}s."
            echo "Refusing to report a duration this job did not measure."
            exit 1
          fi
          BUDGET="$TIER1_BUDGET_SECONDS"
          CEILING="$TIER1_CEILING_SECONDS"
          if [ "$ELAPSED" -gt "$CEILING" ]; then
            VERDICT="OVER THE CEILING"
          elif [ "$ELAPSED" -gt "$BUDGET" ]; then
            VERDICT="over budget"
          else
            VERDICT="within budget"
          fi
          LINE="tier 1 took ${ELAPSED}s - ${VERDICT}"
          DETAIL="budget ${BUDGET}s, ceiling ${CEILING}s"
          echo "${LINE} (${DETAIL})"
          {
            echo "### tier 1 duration"
            echo ""
            echo "| level | seconds |"
            echo "| --- | --- |"
            echo "| elapsed | ${ELAPSED} |"
            echo "| budget | ${BUDGET} |"
            echo "| ceiling | ${CEILING} |"
            echo ""
            echo "${LINE} (${DETAIL})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ELAPSED" -gt "$CEILING" ]; then
            echo "::error::${LINE} (${DETAIL})"
            echo "The ceiling sits BELOW the runaway cutoff on purpose, so this is a"
            echo "failure naming a number rather than a cancellation naming none."
            exit 1
          fi
          if [ "$ELAPSED" -gt "$BUDGET" ]; then
            echo "::warning::${LINE} (${DETAIL})"
            echo "Over budget is a REPORT, not a failure - the lane must never be red"
            echo "for runner noise. The ceiling is what fails it."
          fi
