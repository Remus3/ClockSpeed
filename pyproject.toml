# Clockspeed - project metadata and tool configuration.
#
# Authority for everything below: BOOTSTRAP.md sections 6 (module map), 10
# (build phases), 11 (decision log) and 12 (non-negotiables); CONVENTIONS.md
# sections 2 (single source of truth), 2.1 (size budgets), 7.1 (testing
# discipline) and 10 (character set).
#
# 7-bit ASCII in every byte of this file. That is BOOTSTRAP.md section 12
# item 4 and it is enforced three ways, deliberately overlapping:
#   1. the tier-0 pre-commit character-set gate (authoritative),
#   2. the ruff rules selected below (cheap, fires while typing),
#   3. tests/test_scaffold.py, which asserts on the raw BYTES of every
#      authored text file - the only one of the three that cannot be fooled
#      by a construct the linter does not model.

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"


# ===========================================================================
# Project metadata
# ===========================================================================

[project]
name = "clockspeed"
description = "Deterministic, local, read-only planning and advisory system for a single-player factory-building game."
readme = "README.md"
requires-python = ">=3.13"

# PEP 639 SPDX expression plus the file it is granted by. The copyright HOLDER
# is owned by LICENSE and is deliberately not restated here: a restated fact is
# a fact that will drift (CONVENTIONS.md section 2), and a LICENSE naming nobody
# is a grant with no grantor (CONVENTIONS.md section 14 trap 3).
license = "MIT"
license-files = ["LICENSE"]

# The version lives in exactly ONE place: clockspeed/__init__.py.
# It is read from there at build time by [tool.setuptools.dynamic] below.
# tests/test_scaffold.py asserts that wiring, so a second literal cannot be
# introduced here without turning the suite red.
dynamic = ["version"]

# NO runtime dependencies, and this is a decision rather than an omission.
# BOOTSTRAP.md section 11: "No external optimizer dependency in phase 3.
# Interface first, dependency later and gated." Pillar 2 ships an exhaustive
# lattice search and a weighted-greedy search behind OptimizerBackend, and any
# external linear/integer programming library goes through the CONVENTIONS.md
# section 14 license gate before it is added and must slot behind the existing
# interface without changing a caller. The advice path is also fully
# deterministic and local, so nothing here may ever pull in a network client
# or a model runtime.
dependencies = []

classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
# The toolchain, and only the toolchain. Installing the project without this
# extra must produce a working advisor, because the advice path is
# dependency-free by decision.
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  # THE WORKFLOW GUARD PARSES YAML RATHER THAN GREPPING IT (CS-896), and that
  # is the whole reason this line exists. `.github/workflows/tier1.yml`
  # documents itself heavily, so its COMMENTS spell every flag and key its live
  # steps use. MEASURED: deleting `-n auto` from the real command left an arm
  # asserting `"-n auto" in text` green, because two comments still said it -
  # and the lane silently reverted to serial, straight back into the
  # cancellation CS-896 was filed about. The same held for `if: always()` and
  # for the entire start step. A substring search over a self-documenting file
  # is a search of its documentation.
  #
  # NO SOURCE IS VENDORED, so THIRD_PARTY.md's register - which is for lifted
  # code - gains no row, exactly as ruff, pytest, mypy and pytest-xdist gained
  # none. PyYAML is MIT. tools/edit_lint_check.py already imports it as an
  # OPTIONAL probe and must keep working without it; a dev extra is opt-in and
  # does not change that. The mypy overrides block below already names `yaml`
  # as stub-less, so no new type-checking exception is needed either.
  #
  # NO UPPER BOUND, DELIBERATELY, and the contrast with the two pins below is
  # the point: those bound tools whose OUTPUT SHAPE this repo asserts on. This
  # one is used only for `safe_load` on a mapping, an interface that has been
  # stable across the whole 6.x line, so a bound here would cost review
  # attention and buy nothing.
  "pyyaml>=6.0",
  # A HARD DEPENDENCY OF TIER 1, NOT AN OPTIONAL SPEEDUP (CS-896). The fast
  # lane runs `-n auto`, and its budget is derived from a MEASURED 1.335x on a
  # 2-vCPU runner. tier2.yml installs this opportunistically and tolerates its
  # absence; tier 1 must not, because silently falling back to serial puts the
  # lane back over its runaway cutoff while reporting nothing about why. Living
  # here rather than in the workflow is what gives the pin one owner.
  #
  # THE BOUND IS DELIBERATE, and it is the ruff lesson above applied to a
  # different failure: an unbounded floor let CI resolve a line this machine
  # never ran. The specific risk here is narrower than a formatter's output
  # shape - a major bump may change the DEFAULT DISTRIBUTION MODE, and a budget
  # measured under one scheduler and then enforced under another is a number
  # nobody has measured. The floor is the scheduler tier 1 was MEASURED on
  # (CS-1198): 3.8 reorders the loadfile queue by test count by default, and the
  # hook shard's `--no-loadscope-reorder` is verified against that code.
  # Bump the upper bound only alongside a fresh timing sample on the runner.
  "pytest-xdist>=3.8,<4",
  # UPPER BOUND ADDED 2026-08-23 AND IT IS LOAD-BEARING, NOT TIDINESS. `ruff
  # format --check` changes its OUTPUT SHAPE between minor versions, and 0.16
  # reworded the line CS-838's pre-commit format check reads to NAME the
  # offending file. MEASURED: with no upper bound, CI resolved 0.16.x while this
  # machine ran 0.15.x, the gate still BLOCKED correctly - its verdict is ruff's
  # EXIT CODE and never the message - but it could match no filename, rendered a
  # placeholder instead, and two arms that assert the finding names the file
  # went RED on the runner while passing locally. That is the "a green local
  # suite is evidence about ONE toolchain" trap, and an unbounded pin is what
  # made the two toolchains different.
  #
  # DO NOT WIDEN THIS BACK to a bare floor. Bump the bound DELIBERATELY, and when
  # you do, re-run `ruff format --check .` and the precommit gate suite FIRST -
  # a formatter bump can rewrite the tree and re-shape that output in one step.
  # This NARROWS CS-484's local-versus-CI divergence and does NOT close it: the
  # range still permits drift inside the 0.15 line.
  "ruff>=0.13,<0.16",
]


# ===========================================================================
# Packaging
# ===========================================================================

[tool.setuptools.dynamic]
version = { attr = "clockspeed.__version__" }

[tool.setuptools.packages.find]
# Anchored to clockspeed* so tests/, tools/, scripts/, docs/ and the gitignored
# generated /data/ directory are never swept into a distribution.
include = ["clockspeed*"]
namespaces = false


# ===========================================================================
# ruff - lint
# ===========================================================================

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["clockspeed", "tests"]

# AN EXCLUSION RUFF DISCOVERS IS NOT AN EXCLUSION RUFF IS HANDED (CS-946).
# Ruff applies `exclude` while WALKING a directory, but a path named explicitly
# on the command line overrides it - the documented behaviour, and sensible on
# its own terms. MEASURED on this tree: `ruff format --check .` reported 277
# files already formatted and exit 0, while the pre-commit gate, which passes
# each staged path by name, BLOCKED on ops/loop/slots.py in the same tree and
# the same minute. Two tools disagreeing about one file is exactly the shape a
# vendored byte-pin cannot survive, because the only way to satisfy the gate is
# to rewrite bytes four carrier trees share.
#
# `force-exclude` makes an exclusion mean the same thing to both. It is the
# setting written for hook-driven invocations, and its blast radius here is
# exactly one entry: this file declares NO top-level `exclude` and no lint
# `exclude`, so [tool.ruff.format] exclude is the only list it can act on.
# ADDING A TOP-LEVEL `exclude` LATER WOULD WIDEN THIS SILENTLY - put any new
# exclusion under the section that owns it, never at the top level.
force-exclude = true

[tool.ruff.lint]
# Chosen for rules that catch real bugs rather than rules that enforce taste.
#
#   F, E, W    pyflakes and pycodestyle: undefined names, unused imports.
#   B          bugbear: mutable default args, loop-variable capture, the
#              classes of bug that survive review.
#   A          builtin shadowing - a shadowed "id" or "list" is a real defect.
#   ARG        unused arguments, which usually mean a signature drifted.
#   C4         comprehension misuse.
#   D          docstrings. Every seam in this project is documented at the
#              module it governs; D is what keeps that true.
#   FURB, PERF, PIE, RET, SIM   dead and redundant code.
#   I          import sorting, deterministic and machine-fixable.
#   N          naming.
#   PGH        blanket "noqa" and blanket "type: ignore" - a suppression with
#              no code suppresses the next bug too.
#   PL         pylint subset: too-many-x, magic values, bad comparisons.
#   PT         pytest style: bare asserts on tuples, wrong fixture scoping.
#   PTH        pathlib over os.path, so paths stay portable.
#   RUF        ruff-specific, and see the character-set note below.
#   S          bandit: subprocess misuse, hardcoded credentials, unsafe
#              deserialization. This project reads untrusted binary saves.
#   SLF        private-member access across a seam - a direct signal that a
#              layer reached past its neighbor (BOOTSTRAP.md section 6).
#   T20        stray print(). Output goes through the surface layer.
#   TID        banned relative imports, so a moved module fails loudly.
#   UP         pyupgrade for the >=3.13 floor.
#   YTT        sys.version misuse.
#
# CHARACTER SET, the hard project constraint (BOOTSTRAP.md section 12 item 4):
# ruff has no "reject every byte above 0x7E" rule. The closest it offers is
# selected here and it is a real net, not a substitute:
#   PLC2401 / PLC2403  non-ASCII identifiers and non-ASCII import names.
#   RUF001 / RUF002 / RUF003  ambiguous Unicode in strings, docstrings and
#              comments - this is the net that catches the exact characters
#              CONVENTIONS.md section 10 names: em-dash U+2014, en-dash
#              U+2013 and the four smart quotes.
# All five arrive via the PL and RUF selectors above. They are called out
# explicitly here so nobody narrows those selectors without knowing what is
# lost. What ruff CANNOT see - a non-ASCII byte in a markdown file, a TOML
# comment, or a shell hook - is covered by the pre-commit gate and by
# tests/test_scaffold.py::test_authored_text_files_are_seven_bit_ascii.
select = [
  "A", "ARG", "B", "C4", "D", "E", "F", "FURB", "I", "N", "PERF", "PGH",
  "PIE", "PL", "PT", "PTH", "RET", "RUF", "S", "SIM", "SLF", "T20", "TID",
  "UP", "W", "YTT",
]

ignore = [
  # Conflicts with the formatter; the formatter owns implicit concatenation.
  "ISC001",
  # UP031 rewrites percent-formatting into f-strings. Both are correct Python
  # and the rewrite catches no bug, so it fails the selection test stated
  # above - "rules that catch real bugs, not rules that enforce taste". The
  # rest of the UP family stays on because it does catch real things:
  # deprecated imports, typing constructs the >=3.13 floor has superseded.
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # assert IS the test. Bandit's S101 is written for production code.
  "S101",
  # A test function's NAME is its documentation, and the suite is read as a
  # list of names. D100 and D104 stay on, so the module still has to say what
  # it covers; only the per-function requirement is lifted.
  "D103",
  # The test harness shells out to git to learn which files would be tracked
  # and which are ignored. S603 wants every subprocess call reviewed and S607
  # wants an absolute path to the executable - but hardcoding an absolute
  # interpreter or tool path into a tracked file is forbidden outright
  # (CONVENTIONS.md section 10, BOOTSTRAP.md section 12 item 3). Resolving
  # "git" from PATH is the correct behaviour here, so these two are suppressed
  # at file scope with a reason rather than with a bare noqa.
  "S603", "S607",
]
"scripts/**" = [
  # Same PATH-resolution argument as above: these scripts drive git and the
  # interpreter, and neither may be named by absolute path.
  "S603", "S607",
  # print IS the interface. verify_env.py exists to print a table of every
  # external dependency with found/missing (CONVENTIONS.md section 1). The
  # T20 ban on print is aimed at library code that should be returning values.
  "T201",
]
"tools/**" = [
  "S603", "S607",
  "T201",
]

# ops/** is the headless lane. It carries the SAME three exemptions as tools/
# and scripts/ above, for the same reasons and no others:
#   S603/S607  it shells out to `git`, `gh` and `taskkill` on purpose. Every
#              argv is built from module constants and validated inputs, never
#              from anything a save file or a web page supplied, and every call
#              site sets an explicit timeout. See ops/loop/queue_loop.py._gh,
#              which is the ONE place this package talks to a CLI.
#   T201       the driver's only progress channel is stdout. It runs detached
#              under pythonw with stdout redirected to a file, so a print that
#              is not flushed is a log an operator cannot tail - which is why
#              _emit exists rather than bare prints.
"ops/**" = [
  "S603", "S607",
  "T201",
]

# ops/loop/slots.py IS VENDORED BYTE-IDENTICAL AND MAY NOT BE EDITED (CS-946).
# It is the shared lane-slot protocol the carrier trees coordinate through, so
# the bytes ARE the interface: a formatting change here is not cosmetic, it
# breaks byte-identity with every carrier and makes this tree's own digest pin
# a lie. CLAUDE.md section 4 states the rule for exactly this case - where a
# guard refuses a vendored file, THE GUARD TAKES THE EXEMPTION, never the file.
# The same reasoning already applies to docs/CHANNEL.md; this is its first
# application to a Python file, and it is why the exemption lives here.
#
# SCOPED TO THE ONE PATH, NEVER TO A GLOB, and that is load-bearing rather than
# tidy. "ops/loop/*.py" or a vendored/** directory pattern would absorb
# whatever arrived next, which is the recorded failure mode of an allowlist
# that grows into a denylist. A second vendored file takes a second entry and a
# second reading of its findings.
#
# EVERY CODE BELOW WAS MEASURED ON THESE BYTES, not predicted, and each is a
# property of upstream's code that this tree has no standing to change:
#   N818     SlotTimeout is the upstream exception name and the carriers catch it
#   PLR0911  pid_alive has 7 returns - the Windows/POSIX liveness ladder
#   PLC0415  `import ctypes` sits inside the win32 branch on purpose
#   N806     PROCESS_QUERY_LIMITED_INFORMATION and STILL_ACTIVE are Win32 names
#   PLR2004  the bare 87 is ERROR_INVALID_PARAMETER, named in the comment beside it
#   PTH123   the neutralising write is a builtin open DELIBERATELY - the docstring
#            records that os.replace onto a reader-held file fails on Windows
#   SIM105   try/except/pass around a losing unlink, which is the fail-open point
#   PLR0913  hold() takes the protocol's 10 keyword parameters
#   S311     random.random is backoff jitter, never a credential
#   D205     C4's is_stale docstring runs its summary onto a second line
#   D209     ... and closes its quotes on that same line (CS-1216, the C4 re-pin)
"ops/loop/slots.py" = [
  "N818", "PLR0911", "PLC0415", "N806", "PLR2004", "PTH123", "SIM105",
  "PLR0913", "S311", "D205", "D209",
]

# ops/fleet_kit/fleet_headless.py IS VENDORED BYTE-IDENTICAL FROM MAIN (CS-1231 at
# FLEET-KIT version 4, CS-1272 at version 9, CS-1282 at version 10, CS-1287 at
# version 11) and pinned by
# ops/fleet_kit/MANIFEST.json, which the kit's own conformance() and
# tests/test_fleet_kit.py both check. Same rule as slots.py above: the guard
# takes the exemption, never the file. One path, never a glob. MAIN's v4 ORDER
# note itself says to keep this exclusion.
#
# EVERY CODE BELOW WAS MEASURED ON THE VERSION 11 BYTES (`ruff check` of this file
# with this entry removed, 81 findings), each a property of upstream's code.
# Against version 4, D403 arrived at version 9; at version 10 PLR0912 and
# PLR0915 arrived (_spawn_slotted gained its on_start and stdin_data branches);
# version 11 (CS-1287) added findings but no new code:
#   A002     _run takes an `input` keyword, mirroring subprocess.run's own
#   D102 D103 D107 D205 D209 D403 D415   upstream's docstring layout and coverage
#   N818     Refused is the kit's exception name and every carrier catches it
#   PLC0415  `import winreg` sits inside _registry_value so POSIX imports work,
#            and `import importlib.util` sits inside the helper that loads the
#            sibling fleet_lanes.py by path
#   PLR0912 PLR0915   _spawn_slotted's branch and statement counts (version 10)
#   PLR0913  write_status, spawn and two helpers take the kit's keyword parameters
#   PLR2004  literal 2 and 65536 in pin parsing and the git index check
#   PLW1510  _kill_tree's best-effort taskkill run has no check= argument
"ops/fleet_kit/fleet_headless.py" = [
  "A002", "D102", "D103", "D107", "D205", "D209", "D403", "D415", "N818",
  "PLC0415", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW1510",
]

# THE SIX PYTHON MODULES FLEET-KIT VERSION 9 ADDED (CS-1272), vendored and pinned
# exactly as fleet_headless.py above is, so the same rule holds: one exact path
# per entry, never a glob, and every code MEASURED by `ruff check` of the version
# 11 bytes (CS-1287) under this file's selection, never predicted; version 11
# changed four of the six and added no code to any. Version 10
# added: PLC0415 to fleet_checklist.py (emit's local `import sys`) and
# fleet_inbox.py, UP032 to fleet_done.py (its printf-style formatting became
# .format calls), and ARG002 and PLR0913 to fleet_watch.py (FlatSeenState keeps
# WatchState's source-taking signatures; run_source gained four keywords).
# Codes shared by several:
#   D1xx D205 D209 D403   upstream's docstring layout and coverage
#   N818     the kit's exception names (LaneRefused, SlotTimeout, LockBusy,
#            WatchStateCorrupt, SecretMissing, SecretRefInvalid) are its API
#   PLC0415  imports kept inside a function - Windows-only ctypes, psutil,
#            which is optional, and fleet_done.py's local `import time`
#   PLR0911 PLR0912 PLR0913   long ladders and keyword-parameter APIs by design
#   PLR2004  literal Win32 codes (5, 87, 259, 0xFFFFFFFF), display thresholds
#            and an argv length
#   PLW1510  best-effort subprocess runs that read the return code themselves
#   PTH105 PTH109   os.replace and os.getcwd, upstream's spelling
#   RUF100   a `noqa: BLE001` for a rule this file does not select
#   UP017    datetime.timezone.utc rather than the datetime.UTC alias
# One-file codes: S110 (fleet_done.py's best-effort try/except/pass in the Stop
# hook, which must never block), FURB167 (fleet_inbox.py spells re.M), PERF401
# and RUF023 (fleet_inbox.py's loop append and unsorted __slots__), SLF001
# (fleet_watch.py's own module-level helpers reach its class's private methods).
"ops/fleet_kit/fleet_checklist.py" = ["D102", "D107", "D205", "D209", "PLC0415", "PLR2004"]
"ops/fleet_kit/fleet_done.py" = [
  "D103", "D205", "D209", "PLC0415", "PLR0911", "PLR0912", "PLW1510", "PTH105",
  "PTH109", "RUF100", "S110", "UP017", "UP032",
]
"ops/fleet_kit/fleet_inbox.py" = [
  "D101", "D102", "D103", "D105", "D107", "D205", "D209", "D403", "FURB167",
  "PERF401", "PLC0415", "PLR0911", "PLR2004", "PTH109", "RUF023", "UP017",
]
"ops/fleet_kit/fleet_lanes.py" = [
  "D103", "D205", "D209", "D403", "N818", "PLC0415", "PLR0911", "PLR0913",
  "PLR2004", "PLW1510", "RUF100",
]
"ops/fleet_kit/fleet_secrets.py" = ["D105", "D107", "D205", "D209", "N818", "PLW1510"]
"ops/fleet_kit/fleet_watch.py" = [
  "ARG002", "D102", "D107", "D205", "D209", "N818", "PLC0415", "PLR0911", "PLR0913",
  "PLR2004", "SLF001",
]

# THE ONE PYTHON MODULE FLEET-KIT VERSION 10 ADDED (CS-1282), the SUBAGENT-FIRST
# PreToolUse hook, vendored and pinned exactly as the modules above are. MEASURED
# by `ruff check` of the version 11 bytes (CS-1287) under this file's selection,
# 7 findings, the same as at version 10:
#   D103     its five public functions carry no docstring of their own
#   PTH109   project_root's os.getcwd(), upstream's spelling
#   PTH123   log()'s builtin open() in append mode
"ops/fleet_kit/fleet_subagent_first.py" = ["D103", "PTH109", "PTH123"]

[tool.ruff.lint.isort]
known-first-party = ["clockspeed"]

[tool.ruff.lint.flake8-tidy-imports]
# A relative import survives a module move silently and then imports the wrong
# thing. Absolute imports fail loudly, which is what the seam discipline needs.
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.format]
quote-style = "double"

# THE FORMATTER IS EXCLUDED FROM THE ONE VENDORED FILE, and only from it
# (CS-946). `ruff format` would rewrap ops/loop/slots.py's continuation lines,
# which changes its bytes and therefore its sha256 - the digest four carrier
# trees and this tree's own pin all agree on. A reformatted shared mutex is a
# SECOND mutex, so this is a correctness exclusion rather than a style one.
#
# format.exclude rather than the top-level [tool.ruff] exclude, deliberately:
# the narrower key stops the FORMATTER only and leaves the linter reading the
# file, so the per-file-ignores above stay an explicit, reviewed list of what
# upstream's code does instead of a blanket "ruff does not look here".
#
# ops/fleet_kit/fleet_headless.py takes the same exclusion for the same reason
# (CS-1231): it is pinned by sha256 in the fleet kit's MANIFEST.json, and
# `ruff format --check` MEASURED it as "Would reformat". The six Python modules
# FLEET-KIT version 9 added take it too (CS-1272), each MEASURED "Would
# reformat" on the version 9 bytes, and so does the one version 10 added
# (CS-1282, fleet_subagent_first.py, MEASURED "Would reformat" on its version 10
# bytes) - one exact path per entry, never a pattern. Version 11 (CS-1287) keeps
# the same eight entries.
exclude = [
  "ops/loop/slots.py",
  "ops/fleet_kit/fleet_headless.py",
  "ops/fleet_kit/fleet_checklist.py",
  "ops/fleet_kit/fleet_done.py",
  "ops/fleet_kit/fleet_inbox.py",
  "ops/fleet_kit/fleet_lanes.py",
  "ops/fleet_kit/fleet_secrets.py",
  "ops/fleet_kit/fleet_watch.py",
  "ops/fleet_kit/fleet_subagent_first.py",
]
# LF, matching .gitattributes. Content hashes are load-bearing in this project
# (the game data version pin, BOOTSTRAP.md section 8.1) and a file whose line
# endings depend on the checkout machine cannot be hashed reliably.
line-ending = "lf"


# ===========================================================================
# pytest
# ===========================================================================

[tool.pytest.ini_options]
minversion = "8.0"

# testpaths is a SAFETY control, not a convenience.
# CONVENTIONS.md section 7.1: "Run suites from the repo root with explicit
# target directories, never a bare recursive invocation from the root - that
# can sweep runtime state directories and destroy live locks or data."
# The repo root will hold /data/ (the generated registry), /work/ (save copies
# taken before parsing), /run/ and /logs/. A bare `pytest` from the root would
# walk all of them. Pinning testpaths means a bare invocation collects only
# tests/ and cannot reach live state.
testpaths = ["tests"]

# --strict-markers  an unregistered marker is a typo that silently selects
#                   nothing, which is the "unrun gate" failure class
#                   (CONVENTIONS.md section 7.2).
# --strict-config   an unknown ini key is an error, not a shrug.
# -ra               a short reason line for every non-pass, so a skipped gate
#                   is visible instead of blending into the dots.
addopts = "-ra --strict-markers --strict-config"

# TEMP RETENTION, and the two keys are pulling in OPPOSITE directions on purpose.
# MEASURED on this machine before either was set: a single targeted run of
# tests/test_doc_budget.py left 440 files and 339 directories behind, and a full
# -n auto suite run left ~16,000 files and ~280 MB - once per run, retained three
# runs deep. The shared per-account pytest temp root under %TEMP% held 268,401
# files
# across 39 run dirs when this was filed, of which 165,093 (61.5%) carried
# Clockspeed test-function names. That is this project's own contribution and it
# is what the POLICY key below removes.
#
# tmp_path_retention_policy = "failed"
#   A PASSING test's tmp_path is not evidence of anything - it is the byproduct
#   of an assertion that already held. "failed" discards those at teardown and
#   keeps the tmp_path of every test that failed or errored, which is the only
#   copy of what a flake actually wrote. This suite is thousands of tests and a
#   flake's tmp_path is frequently the sole record, so "none" is refused: it
#   would trade the entire debugging surface for bytes the policy below already
#   reclaims. THE TRADE IS STATED: a test that PASSES but is under suspicion no
#   longer leaves its directory behind. Re-run that one test with
#   `--tmp-path-retention-policy=all` when investigating it.
#
# tmp_path_retention_count = 3
#   DELIBERATELY LEFT AT PYTEST'S DEFAULT rather than dropped to 1, and this is
#   the key where a smaller number is NOT better. The numbered-run root is
#   SHARED - it is per-Windows-account, not per-repository, and four other trees
#   write into the same directory. pytest's cleanup deletes every run dir beyond
#   `keep` whose lock file is gone, and it does not and cannot check who created
#   it. MEASURED during the run that set this: one targeted Clockspeed
#   invocation deleted two run dirs, one of them over a day old, at the default
#   of 3. Lowering the count does not shrink what THIS project writes; it only
#   widens how much of OTHER projects' evidence this project's suite destroys
#   on its way past. The policy key above is the one that reclaims the volume,
#   so there is no volume argument left to buy that with.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 3

# xfail must be honest: an xfail that starts passing is a finding.
xfail_strict = true

markers = [
  "slow: a test the pre-push hook may exclude to keep tier 0 instant. Select the fast subset with -m 'not slow' (CONVENTIONS.md section 8, tier 0 pre-push).",
]


# ===========================================================================
# mypy
# ===========================================================================

[tool.mypy]
# Floor version, not the running version. The project supports >=3.13 and the
# type checker must judge against the floor or it will accept syntax the floor
# rejects.
python_version = "3.13"

# WHAT THE GATE LOOKS AT, and this key is the whole of its authority: CI runs
# `python -m mypy` bare, with no target (.github/workflows/tier1.yml), so a
# path absent from this list is checked by nothing, anywhere. A file outside it
# yields no error rather than a failure, so the gate reports green having never
# read it. "The gate is green" and "the gate looked at this file" are different
# claims, and only the second is worth anything about a specific file.
#
# EVERY AUTHORED DIRECTORY IS NAMED, and the list above is the only record of
# which they are - no count is written here, because a count goes stale the next
# time one is added (it did: ops/ arrived with CS-918). scripts/ arrived with
# CS-411 and tools/ with CS-415. That matters most for the two files
# a fresh clone depends on before anything else has run: scripts/install_hooks.py,
# whose failure leaves a clone unprotected while reporting itself protected
# (docs/ARCHITECTURE.md section 6), and tools/precommit_gate.py, the tier-0 blocking gate
# that installer wires up.
#
# The DIRECTORIES are named, not the individual files, deliberately. A
# file-by-file list would leave every script and tool added tomorrow outside the
# gate by default, which is the same defect wearing a later date.
files = ["clockspeed", "ops", "scripts", "tests", "tools"]

# THERE IS NO `exclude` KEY HERE, AND ADDING ONE IS THE WRONG REFLEX. CS-414
# deleted the last one, and tests/test_mypy_gate.py pins its absence so it
# cannot come back quietly.
#
# `exclude` is a DISCOVERY filter and NOT containment. It stops mypy WALKING to
# a file. It does nothing to stop a checked file from IMPORTING that file, and
# an imported module is built and reported on in full. The deleted key held
# scripts/verify_env.py out of discovery over 5 errors, and it bought nothing
# the moment tools/ joined the list above, because two tools import it as a
# top-level module - a resolution path CS-411 created by making scripts/ a
# source base dir:
#     tools/drift_guard.py::_load_verify_env    import verify_env
#     tools/facts_probe.py::_build_string       import verify_env
# Measured on this tree before the deletion: appending "tools" to `files` gave
# 9 errors in 5 files WITH the key and 9 in 5 WITHOUT it - identical, because
# all 5 of verify_env.py's own came back through that import either way.
#
# Those 5 were one shape, codes arg-type and operator: an `Optional[Path]`
# proven non-None by a separate boolean flag rather than by a narrowing check,
# so mypy could not see the proof. The fix was to narrow at each point of use -
# not to cast, suppress, or widen a signature. A gate hole justified by errors
# nobody is fixing is a hole that outlives its reason.

# TARGET PLATFORM, pinned so this config means the same thing on every machine.
# Without it mypy analyses for the platform it happens to be RUNNING on, and
# `sys.platform` narrows accordingly - so a `if sys.platform != "win32": return`
# guard makes the rest of the function unreachable on Linux and not on Windows.
# That produced a green local run and a red CI run off identical source: three
# `unreachable` errors in clockspeed/data/locate.py, in the platform guards
# around the 8.3 short-path rendering, the drive-root scan and the winreg Steam
# lookup - all of them correct, portable code.
#
# It is pinned to win32 because that is what this project targets: the game
# install, the save directory and the registry lookups are Windows, and the
# `classifiers` block above already says so. The cost is stated rather than
# hidden - the three non-Windows early-return branches are no longer type
# checked. They are `return None`, `return [Path("/")]` and `return []`, which
# is an acceptable trade for making CI and the developer machine agree.
#
# Verified when pinned: `mypy --platform=linux` reports exactly those three and
# nothing else, so this masks no other finding.
platform = "win32"

# STRICTNESS, stated deliberately: this is "check what is written, do not yet
# demand annotations everywhere". The package is a phase-0 skeleton
# (BOOTSTRAP.md section 10) and turning on disallow_untyped_defs today would
# only produce noise about files that do not exist yet. What IS on is the set
# that finds real defects in annotated code plus the set that finds rot in the
# configuration itself.
#
# The ratchet, so this is not left at the loose setting by accident:
#   phase 2 (data layer)  -> disallow_untyped_defs on clockspeed.data.*
#   phase 3 (solver)      -> strict = true on clockspeed.solve.*, because the
#                            exact-arithmetic invariant (no floats in the solve
#                            path) is worth a type-level guard
#   phase 5 (advisor)     -> strict = true package-wide
# Tighten by adding a [[tool.mypy.overrides]] block per module; do not loosen
# a global that was already earned.
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

# A silent import failure makes the whole run vacuous - it type checks nothing
# and exits zero. Report them.
ignore_missing_imports = false

pretty = true
show_error_codes = true


# --- the ratchet, applied ---------------------------------------------------
# Both rungs owed by the schedule above land here. The phase-2 rung was written
# down when CS-200 closed but was never actually applied - the schedule above
# was the only record of it, and a schedule is not a setting. Measured before
# adding either block: `mypy --disallow-untyped-defs clockspeed/data` and
# `mypy --strict clockspeed` both already exited 0, so neither rung costs a
# single fix today. That is exactly when a ratchet should be tightened: the
# cheap moment is before the code that would violate it is written, not after.
#
# DO NOT WRITE `strict = true` IN AN OVERRIDES BLOCK. It is accepted without
# complaint and it is NOT scoped to the module pattern - it turns the strict
# flags on GLOBALLY. Measured on the pinned mypy, on this tree: an overrides
# block of `module = ["clockspeed.solve.*"]` plus `strict = true` produces 25
# errors in tests/data/test_blobs.py, a file that pattern cannot match, while
# the same config with the block removed is clean. Acceptance of the key is not
# evidence of scoping - mypy rejects a bogus key in that position, which makes
# `strict` look validated when it has merely been swallowed and applied
# somewhere else.
#
# So the phase-3 rung is written as the per-module-settable constituents of
# `strict`, which DO scope. Omitted from the list deliberately, because they are
# global-only and are already set in the global block above: warn_unused_configs
# and warn_redundant_casts.

# --- third-party modules that ship no type information ----------------------
# The global `ignore_missing_imports = false` above is deliberate: a silent
# import failure makes a whole run vacuous. So the two stub-less modules the
# TOOLCHAIN imports are named here one by one rather than that global loosened.
#
#   ruff  tools/precommit_gate.py::ruff_command imports it to locate the ruff
#         that lints staged lines. It is installed, and ships no py.typed
#         marker  ->  import-untyped.
#   yaml  tools/edit_lint_check.py::check_yaml imports it. No bundled stubs;
#         mypy's suggested remedy is a types-PyYAML dependency, and this
#         project does not take a dependency to type-check a hook helper.
#
# THIS BLOCK IS WHAT BROUGHT A FROZEN FILE INSIDE THE GATE WITH NO EDIT TO IT.
# tools/precommit_gate.py is frozen under CLAUDE.md section 6, and its only
# error was that ruff import. Naming the MODULE here fixes it from outside;
# adding a `# type: ignore` at its import site would have needed a grant.
#
# THE SCOPING IS MEASURED, NOT ASSUMED, and the distinction is load-bearing
# because the neighbouring `strict` trap documented below is accepted silently
# and applied GLOBALLY. `warn_unused_configs = true` above makes mypy print
# "unused section(s)" naming any overrides block whose module pattern matches
# nothing in the run. This block is never named; a block naming a nonexistent
# module is named immediately. tests/test_mypy_gate.py runs exactly that
# comparison, so the claim is executed rather than believed.
[[tool.mypy.overrides]]
module = ["ruff", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# psutil (CS-918), in a block of its OWN rather than folded into the one above.
# That block's module list is PINNED by
# tests/test_mypy_gate.py::test_the_stubless_import_override_exists_and_is_narrow
# because it is what keeps the frozen tools/precommit_gate.py inside the gate
# with no edit to it - so adding a name to it silently removed that pin, and the
# gate caught it. Two exemptions with two reasons read better as two blocks.
#
# psutil ships no stubs and is an OPTIONAL dependency of the lane:
# ops/loop/lanes.py imports it inside a try and degrades to "cannot prove pid
# reuse" without it, which is the fail-soft answer that predicate is built
# around. A missing-stub error on an import already allowed to be missing would
# redden the gate over the very absence the code is designed to survive.
module = ["psutil"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ops/loop/slots.py, VENDORED BYTE-IDENTICAL (CS-946). A block of its own, for
# the reason the psutil block above states about itself: two exemptions with two
# reasons read as two blocks, and folding this into a neighbour would silently
# retire the pin tests/test_mypy_gate.py holds on that neighbour's module list.
#
# MEASURED, both of them, and both are upstream's shape rather than a defect:
#   slots.py:77  `return k32.GetLastError() != 87` - ctypes.windll returns Any,
#                so the comparison is Any-typed although it is plainly a bool.
#   slots.py:89  `return json.loads(...)` - json.loads is declared to return Any
#                and the function is annotated `-> dict`.
# Either could be fixed in one line by an author with standing to edit the file.
# This tree has none: the bytes are the protocol four carriers share.
#
# ONLY warn_return_any IS RELAXED, and only for this module. The rest of the
# gate - check_untyped_defs, strict_equality, warn_unreachable and the whole
# global block - still reads this file. `exclude` is NOT used and must not be:
# tests/test_mypy_gate.py pins its absence, and it is a DISCOVERY filter that
# would not contain an error reached through an import anyway.
module = ["ops.loop.slots"]
warn_return_any = false

[[tool.mypy.overrides]]
# ops/fleet_kit/fleet_headless.py, VENDORED BYTE-IDENTICAL from MAIN's fleet kit
# (CS-1231 at version 4, CS-1272 at version 9, CS-1282 at version 10, CS-1287 at
# version 11) and pinned by tests/test_fleet_kit.py. A block of its own for the
# reason the slots.py
# block above states about itself.
#
# MEASURED on the version 9 bytes, two shapes, all upstream's, both still
# present at version 11 (the line numbers below are version 11's, CS-1287):
#   union-attr  fleet_headless.py:674-677 `u.get(...)` in usage_line - `u` is
#               bound by `r.get("usage") if isinstance(r.get("usage"), dict)
#               else {}`, a dict on every path, but mypy does not narrow a
#               repeated call so it reads the type as `Any | dict | None` and
#               reports union-attr on each `.get` (535-538 at version 4).
#   arg-type    fleet_headless.py:867 `module_from_spec(spec)` - the spec from
#               spec_from_file_location is typed `ModuleSpec | None`, and the
#               helper that loads the sibling fleet_lanes.py does not narrow it;
#               the same un-narrowed spec is ALSO behind two more union-attr
#               errors at 869 `spec.loader.exec_module(mod)`, measured at
#               version 9 by running this module with union-attr re-enabled.
# MEASURED on the version 10 bytes (CS-1282, bare `python -m mypy`), one more:
#   assignment  fleet_headless.py:992 and 996 (version 11's lines)
#               `marked["ok"] = False` / `True` -
#               `marked = {"ok": None}` is inferred as a dict of None, so a
#               bool assigned into it contradicts that inference.
# The bytes are the protocol every fleet tree shares and may not be edited here.
#
# ONLY these three codes ARE DISABLED, and only for this module. The rest of the
# gate still reads the file; `exclude` is NOT used, for the reason above.
module = ["ops.fleet_kit.fleet_headless"]
disable_error_code = ["union-attr", "arg-type", "assignment"]

[[tool.mypy.overrides]]
# ops/fleet_kit/fleet_inbox.py, VENDORED BYTE-IDENTICAL from MAIN's fleet kit
# version 9 (CS-1272), re-vendored at version 10 (CS-1282) and 11 (CS-1287),
# pinned by tests/test_fleet_kit.py. A block of its own, for the reason the
# slots.py block states. MEASURED, three errors, one line pair (versions 10 and
# 11 add none; the line numbers are version 11's):
#   fleet_inbox.py:470-471 `out["total_usd"] = round(total, 2)` and the
#   inbox_share line beside it - `out` is inferred as a dict of per-kind dicts,
#   so assigning a rounded float (arg-type) or an optional one (assignment)
#   into it contradicts that inference. Upstream's shape, not a defect here.
# ONLY arg-type and assignment ARE DISABLED, and only for this module.
module = ["ops.fleet_kit.fleet_inbox"]
disable_error_code = ["arg-type", "assignment"]

[[tool.mypy.overrides]]
# ops/fleet_kit/fleet_lanes.py, VENDORED BYTE-IDENTICAL from MAIN's fleet kit
# version 9 (CS-1272), re-vendored at version 10 (CS-1282) and 11 (CS-1287),
# neither adding an error, pinned by tests/test_fleet_kit.py. MEASURED at
# version 9, four errors (the line numbers are version 11's):
#   unreachable    fleet_lanes.py:142 - proc_started's psutil fallback after a
#                  win32 branch that returns on every path; mypy judges it on
#                  this platform's sys.platform, so a Linux run would differ
#   var-annotated  fleet_lanes.py:367 `counts = {}` and 391 `out = []`
#   operator       fleet_lanes.py:565 `row["age_s"] > WRITE_GRACE_S` - `row` is
#                  a dict of mixed values, so its age reads as `object`
# ONLY these three codes ARE DISABLED, and only for this module.
module = ["ops.fleet_kit.fleet_lanes"]
disable_error_code = ["unreachable", "var-annotated", "operator"]

[[tool.mypy.overrides]]
# ops/fleet_kit/fleet_watch.py, VENDORED BYTE-IDENTICAL from MAIN's fleet kit
# version 9 (CS-1272), re-vendored at version 10 (CS-1282) and 11 (CS-1287),
# pinned by tests/test_fleet_kit.py. MEASURED at version 9, two errors (line
# numbers are version 11's):
#   attr-defined  fleet_watch.py:120 `self._data["sources"].setdefault(...)` -
#                 `_data` is a dict of mixed values, so its entry reads as
#                 `object`, which has no setdefault
#   unreachable   default_pid_alive's POSIX signal-0 tail (fleet_watch.py:232)
#                 after a win32 branch that returns on every path
# MEASURED on the version 10 bytes (CS-1282, bare `python -m mypy`), two more,
# both in FlatSeenState, whose `_rec` is a dict of mixed values:
#   call-overload fleet_watch.py:178 `list(self._rec["seen"])` - the entry
#                 reads as `object`, which no overload of list() accepts
#   operator      fleet_watch.py:184 `self._rec["seen"] + list(ids)` - the same
#                 `object` as the left operand of +
# ONLY these four codes ARE DISABLED, and only for this module.
module = ["ops.fleet_kit.fleet_watch"]
disable_error_code = ["attr-defined", "unreachable", "call-overload", "operator"]

[[tool.mypy.overrides]]
# Phase 2 rung. The data layer is the seam every other layer consumes, so an
# unannotated def here is an unannotated def everywhere downstream.
module = ["clockspeed.data.*"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Phase 3 rung - `strict` expanded, for the reason stated above. Strict on the
# solver because the exact-arithmetic invariant - no float enters the solve path
# (non-negotiable 6) - is worth a type-level guard in addition to the static AST
# gate and the runtime audit. It catches the case neither of those can see: a
# `float` declared in a signature and flowing in from an annotated caller.
module = ["clockspeed.solve.*"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
